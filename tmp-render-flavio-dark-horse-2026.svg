<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="2160" height="2700" viewBox="0 0 2160 2700" version="1.1"
 xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="photoFrame"><rect x="0" y="0" width="2160" height="1590"/></clipPath>
    <linearGradient id="topShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.70"/>
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="2160" height="2700" fill="#F3F0E9"/>
  <g id="photo-slot" clip-path="url(#photoFrame)">
    <image x="0" y="0" width="2160" height="1590" preserveAspectRatio="none" xlink:href="flavio-photo-crop.jpg"/>
    <rect x="0" y="0" width="2160" height="520" fill="url(#topShade)"/>
  </g>
  <image id="brand-logo" x="800" y="42" width="560" height="181" preserveAspectRatio="xMidYMid meet" xlink:href="logo.png"/>
  <rect x="120" y="1510" width="820" height="80" fill="#FFFFFF"/>
  <text id="photo-credit" x="154" y="1562" fill="#090909"
     font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="2.3">FOTO: EDMAR BARROS / AP</text>
  <rect x="0" y="1590" width="2160" height="986" fill="#090909"/>
  <rect x="0" y="1590" width="2160" height="12" fill="#E30613"/>

  <text id="headline" x="120" y="1788" fill="#FFFFFF"
     font-family="Nimbus Sans, Helvetica, Arial, sans-serif"
     font-size="137" font-weight="700" letter-spacing="-2">
    <tspan x="120" dy="0">Flávio Bolsonaro es investigado</tspan>
    <tspan x="120" dy="154">por corrupción y lavado por</tspan>
    <tspan x="120" dy="154">US$12 millones ligados a una</tspan>
    <tspan x="120" dy="154">película sobre Jair Bolsonaro</tspan>
  </text>

  <text id="date" x="120" y="2510" fill="#E30613"
     font-family="Nimbus Sans, Helvetica, Arial, sans-serif"
     font-size="48" font-weight="700" letter-spacing="2.5">12 DE SETIEMBRE DE 2026</text>
  <text id="location" x="2040" y="2510" text-anchor="end" fill="#BEBAB2"
     font-family="Nimbus Sans, Helvetica, Arial, sans-serif"
     font-size="48" font-weight="600" letter-spacing="2">BRASIL</text>
  <rect x="0" y="2576" width="2160" height="124" fill="#FFFFFF"/>
  <rect x="0" y="2576" width="620" height="124" fill="#E30613"/>
  <text x="310" y="2657" text-anchor="middle" fill="#FFFFFF"
     font-family="Nimbus Sans, Helvetica, Arial, sans-serif"
     font-size="58" font-weight="700" letter-spacing="5">NOTICIA</text>
  <text x="2040" y="2657" text-anchor="end" fill="#090909"
     font-family="Nimbus Sans, Helvetica, Arial, sans-serif"
     font-size="62" font-weight="700" letter-spacing="2">@archivopopular</text>
</svg>