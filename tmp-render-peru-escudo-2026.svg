<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="2160" height="2700" viewBox="0 0 2160 2700" version="1.1" id="svg52"
 xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defs15">
    <clipPath id="photoFrame"><rect x="0" y="0" width="2160" height="1590"/></clipPath>
    <linearGradient id="topShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.70"/>
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="2160" height="2700" fill="#F3F0E9"/>
  <g id="photo-slot" clip-path="url(#photoFrame)">
    <image x="0" y="0" width="2160" height="1590" preserveAspectRatio="none" xlink:href="peru-photo-crop.jpg"/>
    <rect x="0" y="0" width="2160" height="520" fill="url(#topShade)"/>
  </g>
  <image id="brand-logo" x="800" y="42" width="560" height="181" preserveAspectRatio="xMidYMid meet" xlink:href="logo.png"/>
  <rect x="120" y="1510" width="920" height="80" fill="#FFFFFF"/>
  <text id="photo-credit" x="154" y="1562" fill="#090909" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="2.5">FOTO: PAOLO AGUILAR / EFE</text>
  <rect x="0" y="1590" width="2160" height="986" fill="#090909"/>
  <rect id="brand-divider" x="0" y="1590" width="2160" height="12" fill="#E30613"/>
  <text id="headline" x="120" y="1782" fill="#FFFFFF" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="145" font-weight="700" letter-spacing="-2"><tspan x="120" dy="0">Keiko Fujimori suma a Perú</tspan><tspan x="120" dy="168">al “Escudo de las Américas”</tspan><tspan x="120" dy="168">de Trump y refuerza su</tspan><tspan x="120" dy="168">alianza con EE.UU.</tspan></text>
  <text id="date" x="120" y="2510" fill="#E30613" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="2.5">10 DE SETIEMBRE DE 2026</text>
  <text id="location" x="2040" y="2510" text-anchor="end" fill="#BEBAB2" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="48" font-weight="600" letter-spacing="2">LIMA · PERÚ</text>
  <rect x="0" y="2576" width="2160" height="124" fill="#FFFFFF"/>
  <rect x="0" y="2576" width="620" height="124" fill="#E30613"/>
  <text id="news-label" x="310" y="2657" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="5">NOTICIA</text>
  <text id="handle" x="2040" y="2657" text-anchor="end" fill="#090909" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="2">@archivopopular</text>
</svg>