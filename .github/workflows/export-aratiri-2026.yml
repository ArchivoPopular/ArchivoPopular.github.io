name: Exportar placa Aratirí (SVG oficial a PNG)
on:
  push:
    paths:
      - 'assets/news/aratiri-2026-master.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar motor SVG y fuente Nimbus Sans
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y inkscape fonts-urw-base35
      - name: Descargar fotografía documental original
        run: |
          curl -fL --retry 4 --retry-delay 3 -A 'Mozilla/5.0' \
            'https://upload.wikimedia.org/wikipedia/commons/4/45/Jorge_D%C3%ADaz_en_el_Consejo_de_Ministros_de_Uruguay_del_11_de_agosto_de_2026.jpg' \
            -o /tmp/aratiri-photo.jpg
          test "$(stat -c%s /tmp/aratiri-photo.jpg)" -gt 100000
      - name: Incorporar fotografía y logotipo oficiales sin alterar la plantilla
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          s=Path('assets/news/aratiri-2026-master.svg').read_text()
          photo='https://upload.wikimedia.org/wikipedia/commons/4/45/Jorge_D%C3%ADaz_en_el_Consejo_de_Ministros_de_Uruguay_del_11_de_agosto_de_2026.jpg'
          s=s.replace(photo, 'data:image/jpeg;base64,'+base64.b64encode(Path('/tmp/aratiri-photo.jpg').read_bytes()).decode())
          s=s.replace('https://archivopopular.github.io/logo.png','data:image/png;base64,'+base64.b64encode(Path('logo.png').read_bytes()).decode())
          Path('/tmp/aratiri-embedded.svg').write_text(s)
          PY
      - name: Exportar PNG máster 2160 × 2700
        run: |
          inkscape /tmp/aratiri-embedded.svg --export-filename=assets/news/aratiri-2026-master.png --export-width=2160
          file assets/news/aratiri-2026-master.png
          test "$(stat -c%s assets/news/aratiri-2026-master.png)" -gt 1000000
      - name: Publicar PNG en la web
        run: |
          git config user.name 'archivo-popular-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/news/aratiri-2026-master.png
          git commit -m 'Publicar placa PNG máster Aratirí 29 octubre 2026'
          git push
