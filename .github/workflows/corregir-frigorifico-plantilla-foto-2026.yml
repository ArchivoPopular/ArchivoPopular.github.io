name: Finalizar corrección Frigorífico Tacuarembó

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corregir-frigorifico-plantilla-foto-2026.yml'

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir pie de foto y limpiar flujos temporales
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noticias/frigorifico-tacuarembo-1300-seguro-paro-2026.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace(
            'Imagen del conflicto en el Frigorífico Tacuarembó. Foto: Camilo Dos Santos / Presidencia de la República · Archivo, 23 de abril de 2026.',
            'Trabajadores en la planta del Frigorífico Tacuarembó. Foto de archivo: Camilo Dos Santos / Presidencia de la República · 23 de abril de 2026.'
          )
          p.write_text(t,encoding='utf-8')
          PY
          git config user.name 'Archivo Popular Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/preview-fotos-presidencia-tacuarembo-2026.yml || true
          git rm -f .github/workflows/corregir-frigorifico-plantilla-foto-2026.yml || true
          git add noticias/frigorifico-tacuarembo-1300-seguro-paro-2026.html
          git commit -m 'Finalizar corrección visual del Frigorífico Tacuarembó'
          git push origin HEAD:main
