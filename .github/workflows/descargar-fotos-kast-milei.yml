name: Descargar fotos Kast Milei
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/descargar-fotos-kast-milei.yml'
permissions:
  contents: read
jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar galería oficial
        run: |
          python - <<'PY'
          import requests,zipfile,io,os,urllib3
          urllib3.disable_warnings()
          u='https://prensa.presidencia.cl/lfi-content/downloads/comunicado_img_339732.zip'
          r=requests.get(u,timeout=60,verify=False)
          r.raise_for_status()
          z=zipfile.ZipFile(io.BytesIO(r.content))
          os.makedirs('/tmp/kast-milei',exist_ok=True)
          z.extractall('/tmp/kast-milei')
          for root,dirs,files in os.walk('/tmp/kast-milei'):
              for f in files:
                  print(os.path.join(root,f))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fotos-oficiales-kast-milei
          path: /tmp/kast-milei
