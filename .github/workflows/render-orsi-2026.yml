name: Publicar Orsi 4 setiembre 2026

on:
  push:
    paths:
      - '.github/workflows/render-orsi-2026.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar dependencias
        run: python -m pip install --quiet pillow
      - name: Crear placa, nota e índices
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps, ImageFilter
          import urllib.request, json, re, html

          root = Path('.')
          slug = 'orsi-violencia-genero-hecho-aislado-2026'
          photo_rel = 'assets/news/orsi-canelones-setiembre-4-2026.jpg'
          plate_rel = 'assets/social/archivo-popular-orsi-violencia-genero-2026-master.png'
          article_rel = f'noticias/{slug}.html'
          photo_url = 'https://media.subrayado.com.uy/p/536a96e2d1a0acd1251b80cbe8a4da19/adjuntos/230/imagenes/004/086/0004086204/658x425/smart/orsi-en-canelones-setiembre-4.jpg'

          Path(photo_rel).parent.mkdir(parents=True, exist_ok=True)
          Path(plate_rel).parent.mkdir(parents=True, exist_ok=True)
          req = urllib.request.Request(photo_url, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              Path(photo_rel).write_bytes(r.read())

          # Placa 4:5 de Archivo Popular: misma arquitectura de la plantilla maestra.
          W, H = 2160, 2700
          photo_h = 1590
          canvas = Image.new('RGB', (W, H), '#090909')
          src = Image.open(photo_rel).convert('RGB')
          src = src.filter(ImageFilter.UnsharpMask(radius=1.2, percent=115, threshold=3))
          fitted = ImageOps.fit(src, (W, photo_h), method=Image.Resampling.LANCZOS, centering=(0.50, 0.50))
          canvas.paste(fitted, (0, 0))

          # Protección superior para la marca.
          overlay = Image.new('RGBA', (W, 520), (0,0,0,0))
          od = ImageDraw.Draw(overlay)
          for y in range(520):
              a = int(165 * (1 - y/520))
              od.line((0,y,W,y), fill=(0,0,0,a))
          canvas.paste(overlay, (0,0), overlay)

          # Logo blanco y rojo del sitio.
          logo = Image.open('logo.png').convert('RGBA')
          logo.thumbnail((560,181), Image.Resampling.LANCZOS)
          lx = (W-logo.width)//2
          canvas.paste(logo, (lx,42), logo)

          draw = ImageDraw.Draw(canvas)
          font_bold = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          font_regular = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          credit_font = ImageFont.truetype(font_bold, 32)
          credit = 'FOTO: CAPTURA / SUBRAYADO'
          cb = draw.textbbox((0,0), credit, font=credit_font)
          cw = cb[2]-cb[0] + 68
          draw.rectangle((120,1510,120+cw,1590), fill='white')
          draw.text((154,1532), credit, font=credit_font, fill='#090909')

          # Titular y divisor.
          draw.rectangle((0,1590,W,2576), fill='#090909')
          draw.rectangle((0,1590,W,1602), fill='#E30613')
          headline_font = ImageFont.truetype(font_bold, 124)
          lines = [
              'ORSI PRECISÓ SUS DICHOS',
              '“LA VIOLENCIA DE GÉNERO',
              'NO ES NINGÚN HECHO',
              'AISLADO”'
          ]
          y = 1720
          for line in lines:
              draw.text((120,y), line, font=headline_font, fill='white', spacing=0)
              y += 156

          date_font = ImageFont.truetype(font_bold, 48)
          place_font = ImageFont.truetype(font_bold, 48)
          date = '4 DE SETIEMBRE DE 2026'
          place = 'CANELONES · URUGUAY'
          draw.text((120,2465), date, font=date_font, fill='#E30613')
          pb = draw.textbbox((0,0), place, font=place_font)
          draw.text((2040-(pb[2]-pb[0]),2465), place, font=place_font, fill='#BEBAB2')

          # Pie.
          draw.rectangle((0,2576,W,H), fill='white')
          draw.rectangle((0,2576,620,H), fill='#E30613')
          label_font = ImageFont.truetype(font_bold, 58)
          handle_font = ImageFont.truetype(font_bold, 62)
          label = 'NOTICIA'
          lb = draw.textbbox((0,0), label, font=label_font)
          draw.text((310-(lb[2]-lb[0])/2,2600), label, font=label_font, fill='white')
          handle = '@archivopopular'
          hb = draw.textbbox((0,0), handle, font=handle_font)
          draw.text((2040-(hb[2]-hb[0]),2595), handle, font=handle_font, fill='#090909')
          canvas.save(plate_rel, 'PNG', optimize=True)

          title = 'Orsi precisó sus dichos: “La violencia de género no es ningún hecho aislado”'
          summary = 'Tras las críticas por haber hablado de “casos muy aislados”, el presidente sostuvo que esa frase refería al marco de Secundaria. Admitió que pudo faltarle precisión y afirmó que la violencia de género “es de todos los días”.'
          category = 'Política nacional · Violencia de género'
          place_web = 'Canelones · Uruguay'
          canonical = f'https://archivopopular.github.io/{article_rel}'
          image_abs = f'https://archivopopular.github.io/{photo_rel}'

          article = f'''<!doctype html>
          <html lang="es-UY">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#090909">
            <meta name="description" content="{html.escape(summary, quote=True)}">
            <meta property="og:type" content="article">
            <meta property="og:title" content="{html.escape(title, quote=True)}">
            <meta property="og:description" content="{html.escape(summary, quote=True)}">
            <meta property="og:image" content="{image_abs}">
            <meta property="article:published_time" content="2026-09-04T14:21:00-03:00">
            <link rel="canonical" href="{canonical}">
            <link rel="stylesheet" href="../styles.css?v=20260828-1">
            <title>Orsi precisó sus dichos sobre violencia de género | Archivo Popular</title>
            <script type="application/ld+json">
            {{
              "@context": "https://schema.org",
              "@type": "NewsArticle",
              "headline": {json.dumps(title, ensure_ascii=False)},
              "datePublished": "2026-09-04T14:21:00-03:00",
              "dateModified": "2026-09-04T14:21:00-03:00",
              "inLanguage": "es-UY",
              "image": ["{image_abs}"],
              "author": {{"@type": "Organization", "name": "Archivo Popular"}},
              "publisher": {{"@type": "Organization", "name": "Archivo Popular", "url": "https://archivopopular.github.io/"}},
              "mainEntityOfPage": "{canonical}"
            }}
            </script>
          </head>
          <body>
            <a class="skip-link" href="#contenido">Saltar al contenido</a>
            <header class="site-header">
              <div class="wrapper topline"><span>Montevideo · Uruguay · Desde 2023</span><span>Noticias, memoria y fotografía</span></div>
              <div class="wrapper brandbar">
                <a class="brand" href="../index.html" aria-label="Archivo Popular, inicio"><img src="../logo.png" alt="Archivo Popular" width="2269" height="713"></a>
                <nav class="site-nav" aria-label="Navegación principal" data-open="false">
                  <ul><li><a href="../index.html">Inicio</a></li><li><a href="../noticias.html" aria-current="page">Noticias</a></li><li><a href="../personajes.html">Archivo político</a></li><li><a href="../historia.html">Historia</a></li><li><a href="../fotografos.html">Fotógrafos</a></li><li><a href="../index.html#nosotros">Nosotros</a></li></ul>
                </nav>
                <button class="menu-button" type="button" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span><span></span></button>
              </div>
            </header>

            <main id="contenido" class="page-main">
              <article class="wrapper article-shell">
                <header class="article-header">
                  <p class="eyebrow">{category}</p>
                  <p class="story-meta"><span>4 DE SETIEMBRE DE 2026 · 14:21</span><span>{place_web}</span><span>Archivo Popular</span></p>
                  <h1>{title}</h1>
                  <p class="article-deck">{summary}</p>
                </header>

                <figure class="article-figure">
                  <img src="../{photo_rel}" alt="Yamandú Orsi habla ante la prensa en Canelones el 4 de setiembre de 2026" width="658" height="425">
                  <figcaption>Yamandú Orsi durante la rueda de prensa de este viernes en Canelones. Foto: captura / Subrayado.</figcaption>
                </figure>

                <div class="article-body">
                  <p>Yamandú Orsi volvió este viernes sobre sus declaraciones acerca del intento de femicidio ocurrido en la Facultad de Medicina, después de que la expresión “casos muy aislados” generara críticas en redes sociales y entre estudiantes.</p>

                  <p>El presidente sostuvo que esa frase se refería a la pregunta sobre si Secundaria había estado a la altura frente a los antecedentes del agresor cuando cursaba el liceo en Salinas. “La violencia de género no es ningún hecho aislado”, afirmó, y reconoció que “capaz” le faltó precisar ese punto cuando habló el jueves.</p>

                  <p>Orsi también rechazó que un eventual problema de salud mental pueda utilizarse para desdibujar el carácter del ataque. Señaló que se trató de violencia de género y remarcó que ese fenómeno “es de todos los días”.</p>

                  <p>Al mismo tiempo, defendió que no se responsabilice automáticamente a los centros educativos por un problema que, según planteó, es más profundo y cultural. Dijo haber hablado con docentes y autoridades de Secundaria sobre cómo se actuó con las herramientas disponibles cuando surgieron denuncias durante la etapa liceal del agresor.</p>

                  <p>La precisión no elimina la discusión abierta sobre la respuesta institucional. Exestudiantes del liceo de Salinas sostuvieron que denuncias previas por acoso no fueron tramitadas adecuadamente, mientras que el gremio de Medicina cuestionó las primeras expresiones del mandatario y rechazó considerar la violencia contra las mujeres como un episodio aislado.</p>

                  <p>La formulación de este viernes permite distinguir dos planos que quedaron mezclados en la primera declaración: Orsi sigue considerando excepcional un ataque de estas características dentro de un centro educativo, pero afirma que la violencia de género que lo atraviesa es estructural y cotidiana.</p>

                  <p>Archivo Popular reconstruyó previamente el ataque, las lesiones verificadas y la respuesta estudiantil en su <a href="minuto-a-minuto-ataque-facultad-medicina-2026.html">cronología de la tentativa de femicidio en Medicina</a>.</p>
                </div>

                <aside class="article-aside" aria-labelledby="fuentes">
                  <h2 id="fuentes">Fuentes consultadas</h2>
                  <ul class="source-list">
                    <li><a href="https://www.subrayado.com.uy/la-violencia-genero-no-es-ningun-hecho-aislado-dijo-orsi-capaz-que-me-falto-precisar-eso-n1017271" rel="noopener" target="_blank">Subrayado · Declaraciones de Orsi del 4 de setiembre</a></li>
                    <li><a href="https://www.teledoce.com/telemundo/nacionales/orsi-tras-criticas-por-sus-dichos-sobre-intento-de-femicidio-en-medicina-la-violencia-de-genero-no-es-ningun-hecho-aislado/" rel="noopener" target="_blank">Telemundo · Contexto de las críticas y nueva precisión</a></li>
                    <li><a href="https://ladiaria.com.uy/politica/articulo/2026/9/orsi-tras-intento-de-femicidio-en-la-fmed-no-responsabilicemos-a-las-instituciones-de-algo-que-es-mucho-mas-profundo/" rel="noopener" target="_blank">la diaria · Alcance de la referencia al “hecho aislado” y dimensión cultural</a></li>
                  </ul>
                </aside>
              </article>
            </main>

            <footer class="site-footer">
              <div class="wrapper footer-grid">
                <div class="footer-brand"><img src="../logo.png" alt="Archivo Popular" width="2269" height="713"><p>Noticias políticas, memoria y fotografía desde Uruguay con una mirada popular y latinoamericana.</p></div>
                <div class="footer-column"><h2>Secciones</h2><ul><li><a href="../noticias.html">Noticias</a></li><li><a href="../personajes.html">Archivo político</a></li><li><a href="../historia.html">Historia de las izquierdas</a></li><li><a href="../fotografos.html">Nuestros fotógrafos</a></li></ul></div>
                <div class="footer-column"><h2>Seguinos</h2><ul><li><a href="https://www.instagram.com/archivopopular/" rel="me noopener" target="_blank">Instagram</a></li><li><a href="https://www.facebook.com/profile.php?id=61560610077791" rel="noopener" target="_blank">Facebook</a></li><li><a href="https://www.tiktok.com/@archivopopular" rel="noopener" target="_blank">TikTok</a></li></ul></div>
              </div>
              <div class="wrapper footer-bottom"><span>Archivo Popular © <span data-current-year>2026</span></span><span>Montevideo, Uruguay</span></div>
            </footer>
            <script src="../site.js?v=20260828-1" defer></script>
          </body>
          </html>
          '''
          Path(article_rel).write_text(article, encoding='utf-8')

          # Fuente de datos de noticias.
          news_path = Path('data/noticias.json')
          stories = json.loads(news_path.read_text(encoding='utf-8'))
          stories = [s for s in stories if s.get('id') != slug]
          stories.insert(0, {
              'id': slug,
              'title': title,
              'summary': summary,
              'category': category,
              'date': '2026-09-04T14:21:00-03:00',
              'dateDisplay': '4 SEP 2026',
              'place': place_web,
              'image': photo_rel,
              'imageAlt': 'Yamandú Orsi habla ante la prensa en Canelones el 4 de setiembre de 2026',
              'photoCredit': 'Captura / Subrayado · 4 de setiembre de 2026',
              'url': article_rel
          })
          news_path.write_text(json.dumps(stories, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Fallback estático de portada + OG; el JS seguirá leyendo data/noticias.json.
          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = re.sub(r'<meta property="og:image" content="[^"]+">', f'<meta property="og:image" content="{image_abs}">', index, count=1)
          lead = f'''<article class="lead-story" data-latest-story aria-live="polite">
                <figure>
                  <img src="{photo_rel}" alt="Yamandú Orsi habla ante la prensa en Canelones el 4 de setiembre de 2026" width="658" height="425">
                  <figcaption class="photo-credit">Foto: Captura / Subrayado · 4 de setiembre de 2026</figcaption>
                </figure>
                <div class="lead-copy">
                  <p class="story-meta"><span>4 SEP 2026</span><span>{place_web}</span></p>
                  <h1 id="ultima-noticia">{title}</h1>
                  <p class="summary">{summary}</p>
                  <a class="story-link" href="{article_rel}">Leer la noticia completa</a>
                </div>
              </article>'''
          index = re.sub(r'<article class="lead-story" data-latest-story aria-live="polite">[\s\S]*?</article>', lead, index, count=1)
          index_path.write_text(index, encoding='utf-8')

          # Fallback estático de Noticias.
          noticias_path = Path('noticias.html')
          nhtml = noticias_path.read_text(encoding='utf-8')
          if article_rel not in nhtml:
              card = f'''\n          <a class="news-card" href="{article_rel}">
            <figure><img src="{photo_rel}" alt="Yamandú Orsi habla ante la prensa en Canelones el 4 de setiembre de 2026" width="658" height="425"></figure>
            <div class="news-card__body"><p class="eyebrow">{category}</p><h2>{title}</h2><p>{summary}</p><p class="story-meta"><span>4 SEP 2026</span><span>{place_web}</span></p></div>
          </a>'''
              nhtml = nhtml.replace('<div class="news-grid" data-news-grid aria-live="polite">', '<div class="news-grid" data-news-grid aria-live="polite">' + card, 1)
          noticias_path.write_text(nhtml, encoding='utf-8')

          # Feed RSS.
          feed_path = Path('feed.xml')
          feed = feed_path.read_text(encoding='utf-8')
          feed = re.sub(r'<lastBuildDate>.*?</lastBuildDate>', '<lastBuildDate>Fri, 04 Sep 2026 17:21:00 GMT</lastBuildDate>', feed, count=1)
          if canonical not in feed:
              item = f'''    <item>\n      <title>{html.escape(title)}</title>\n      <link>{canonical}</link>\n      <guid isPermaLink="true">{canonical}</guid>\n      <pubDate>Fri, 04 Sep 2026 17:21:00 GMT</pubDate>\n      <description>{html.escape(summary)}</description>\n    </item>\n'''
              feed = feed.replace('    <item>', item + '    <item>', 1)
          feed_path.write_text(feed, encoding='utf-8')

          # Sitemap.
          sitemap_path = Path('sitemap.xml')
          sitemap = sitemap_path.read_text(encoding='utf-8')
          sitemap = sitemap.replace('<loc>https://archivopopular.github.io/</loc><lastmod>2026-09-03</lastmod>', '<loc>https://archivopopular.github.io/</loc><lastmod>2026-09-04</lastmod>', 1)
          sitemap = sitemap.replace('<loc>https://archivopopular.github.io/noticias.html</loc><lastmod>2026-09-03</lastmod>', '<loc>https://archivopopular.github.io/noticias.html</loc><lastmod>2026-09-04</lastmod>', 1)
          sitemap = sitemap.replace('<loc>https://archivopopular.github.io/buscar.html</loc><lastmod>2026-09-03</lastmod>', '<loc>https://archivopopular.github.io/buscar.html</loc><lastmod>2026-09-04</lastmod>', 1)
          if canonical not in sitemap:
              marker = '  <url><loc>https://archivopopular.github.io/noticias/coalicion-pension-familiares-expresos-politicos-2026.html</loc>'
              entry = f'  <url><loc>{canonical}</loc><lastmod>2026-09-04</lastmod><changefreq>monthly</changefreq><priority>0.8</priority></url>\n'
              sitemap = sitemap.replace(marker, entry + marker, 1)
          sitemap_path.write_text(sitemap, encoding='utf-8')
          PY

          node scripts/generar-buscador.mjs

      - name: Guardar publicación
        run: |
          git config user.name "Archivo Popular Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/news/orsi-canelones-setiembre-4-2026.jpg assets/social/archivo-popular-orsi-violencia-genero-2026-master.png noticias/orsi-violencia-genero-hecho-aislado-2026.html data/noticias.json data/buscador.json index.html noticias.html feed.xml sitemap.xml
          git commit -m "Publicar precisión de Orsi sobre violencia de género"
          git push
      - name: Exportar placa
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-orsi-4-setiembre-2026
          path: assets/social/archivo-popular-orsi-violencia-genero-2026-master.png
