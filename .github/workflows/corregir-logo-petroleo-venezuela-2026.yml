name: Corregir logo petróleo Venezuela 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corregir-logo-petroleo-venezuela-2026.yml'

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet pillow
      - name: Aplicar logo master
        run: |
          python <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/social/archivo-popular-eeuu-petroleo-venezuela-100-anos-2026-master.png')
          canvas=Image.open(p).convert('RGBA')
          logo=Image.open('logo.png').convert('RGBA').resize((560,181),Image.Resampling.LANCZOS)
          canvas.alpha_composite(logo,(800,42))
          canvas.convert('RGB').save(p,'PNG',optimize=True)
          PY
      - name: Commit
        run: |
          git config user.name 'Archivo Popular Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/social/archivo-popular-eeuu-petroleo-venezuela-100-anos-2026-master.png
          git commit -m 'Corregir logo de placa sobre petróleo venezolano'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-petroleo-venezuela-master-final
          path: assets/social/archivo-popular-eeuu-petroleo-venezuela-100-anos-2026-master.png
