name: Render Flavio Dark Horse 2026

on:
  push:
    paths:
      - 'tmp-render-flavio-dark-horse-2026.svg'
      - '.github/workflows/tmp-render-flavio-dark-horse-2026.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas y tipografía
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-urw-base35

      - name: Descargar fotografía real de AP
        run: |
          curl -L --fail 'https://dims.apnews.com/dims4/default/61cb711/2147483647/strip/true/crop/5616x3744%2B0%2B0/resize/1600x1067%21/quality/90/?url=https%3A%2F%2Fassets.apnews.com%2F32%2F4f%2F0a30130a451ca452747afeecc9d7%2F0985b79e037c46419db839a3be4f77b0' -o flavio-ap.jpg
          convert flavio-ap.jpg -auto-orient -quality 96 flavio-ap-clean.jpg

      - name: Guardar fotografía en la web
        run: |
          mkdir -p assets/news
          cp flavio-ap-clean.jpg assets/news/flavio-bolsonaro-dark-horse-ap-2026.jpg
          git config user.name "Archivo Popular"
          git config user.email "santiagoares3@gmail.com"
          git add assets/news/flavio-bolsonaro-dark-horse-ap-2026.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Agrega foto real de Flavio Bolsonaro por caso Dark Horse"
            git push
          fi

      - name: Preparar recorte proporcional
        run: |
          convert flavio-ap-clean.jpg -resize '2160x1590^' -gravity center -extent 2160x1590 flavio-photo-crop.jpg

      - name: Renderizar PNG máster
        run: |
          rsvg-convert -w 2160 -h 2700 tmp-render-flavio-dark-horse-2026.svg -o archivo-popular-flavio-dark-horse-2026-master.png
          file archivo-popular-flavio-dark-horse-2026-master.png

      - name: Subir PNG máster
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-flavio-dark-horse-2026
          path: archivo-popular-flavio-dark-horse-2026-master.png
          retention-days: 7
