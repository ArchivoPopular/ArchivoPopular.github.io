name: Render Gaza ONU 630 2026

on:
  push:
    paths:
      - 'tmp-render-gaza-onu-630-2026.svg'
      - '.github/workflows/tmp-render-gaza-onu-630-2026.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas y tipografía
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-urw-base35

      - name: Descargar fotografía real de AFP
        run: |
          curl -L --fail 'https://image.hurimg.com/i/hurriyet/75/0x0/6a9d66bd242e1cf6f869ff25.jpg' -o gaza-afp.jpg

      - name: Guardar fotografía en la web
        run: |
          mkdir -p assets/news
          cp gaza-afp.jpg assets/news/gaza-630-cuerpos-afp-2026.jpg
          git config user.name "Archivo Popular"
          git config user.email "santiagoares3@gmail.com"
          git add assets/news/gaza-630-cuerpos-afp-2026.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Agrega foto AFP para noticia sobre cuerpos recuperados en Gaza"
            git push
          fi

      - name: Preparar recorte proporcional
        run: |
          convert gaza-afp.jpg -resize '2160x1590^' -gravity center -extent 2160x1590 gaza-photo-crop.jpg

      - name: Renderizar PNG máster
        run: |
          rsvg-convert -w 2160 -h 2700 tmp-render-gaza-onu-630-2026.svg -o archivo-popular-gaza-onu-630-cuerpos-2026-master.png
          file archivo-popular-gaza-onu-630-cuerpos-2026-master.png

      - name: Subir PNG máster
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-gaza-onu-630-cuerpos-2026
          path: archivo-popular-gaza-onu-630-cuerpos-2026-master.png
          retention-days: 7
