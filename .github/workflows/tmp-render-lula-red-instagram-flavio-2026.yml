name: Render Orsi Lula Nueva York 2026

on:
  push:
    paths:
      - 'tmp-render-orsi-lula-nueva-york-2026.svg'
      - '.github/workflows/tmp-render-lula-red-instagram-flavio-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-urw-base35
      - name: Descargar fotografia periodistica real
        run: |
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://imagenes.montevideo.com.uy/imgnoticias/202609/_W933_80/972279.jpg' -o orsi-lula-photo.jpg
          identify orsi-lula-photo.jpg
          cp logo.png archivo-popular-logo-master.png
      - name: Renderizar PNG master
        run: |
          rsvg-convert -w 2160 -h 2700 tmp-render-orsi-lula-nueva-york-2026.svg -o archivo-popular-orsi-lula-nueva-york-2026-master.png
          identify archivo-popular-orsi-lula-nueva-york-2026-master.png
      - name: Guardar foto y PNG master en el sitio
        run: |
          mkdir -p assets/news assets/cards
          cp orsi-lula-photo.jpg assets/news/orsi-lula-nueva-york-presidencia-2026.jpg
          cp archivo-popular-orsi-lula-nueva-york-2026-master.png assets/cards/archivo-popular-orsi-lula-nueva-york-2026-master.png
          git config user.name 'Archivo Popular'
          git config user.email 'santiagoares3@gmail.com'
          git add assets/news/orsi-lula-nueva-york-presidencia-2026.jpg assets/cards/archivo-popular-orsi-lula-nueva-york-2026-master.png
          if ! git diff --cached --quiet; then
            git commit -m 'Integra placa master de Orsi y Lula'
            git pull --rebase --autostash origin main
            git push
          fi
