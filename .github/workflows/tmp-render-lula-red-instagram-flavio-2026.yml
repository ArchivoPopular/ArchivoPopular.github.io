name: Render Lula red Instagram Flavio 2026

on:
  push:
    paths:
      - 'tmp-render-lula-red-instagram-flavio-2026.svg'
      - '.github/workflows/tmp-render-lula-red-instagram-flavio-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-urw-base35
      - name: Descargar fotografia periodistica real
        run: |
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://f.i.uol.com.br/fotografia/2026/09/19/17898436786aaed8dee3d93_1789843678_3x2_md.jpg' -o flavio-photo.jpg
          identify flavio-photo.jpg
          cp logo.png archivo-popular-logo-master.png
      - name: Guardar fotografia original en el sitio
        run: |
          mkdir -p assets/news
          cp flavio-photo.jpg assets/news/flavio-bolsonaro-joinville-vittor-sales-2026.jpg
          git config user.name 'Archivo Popular'
          git config user.email 'santiagoares3@gmail.com'
          git add assets/news/flavio-bolsonaro-joinville-vittor-sales-2026.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Integra foto real de Flavio Bolsonaro en Joinville'
            git pull --rebase --autostash origin main
            git push
          fi
      - name: Renderizar PNG master
        run: |
          rsvg-convert -w 2160 -h 2700 tmp-render-lula-red-instagram-flavio-2026.svg -o archivo-popular-lula-red-instagram-flavio-2026-master.png
          identify archivo-popular-lula-red-instagram-flavio-2026-master.png
      - name: Subir PNG master
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-lula-red-instagram-flavio-2026
          path: archivo-popular-lula-red-instagram-flavio-2026-master.png
          retention-days: 7
