name: Integrar noticia Milei Malvinas 2026

on:
  push:
    paths:
      - '.github/workflows/tmp-integrate-milei-malvinas-2026.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar fotografía oficial
        run: |
          mkdir -p assets/news
          curl -L --fail 'https://www.casarosada.gob.ar/images/202604/JMM001.jpg' -o assets/news/milei-malvinas-presidencia-2026.jpg

      - name: Incorporar noticia al archivo
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/noticias.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          story={
            'id':'milei-malvinas-sanciones-20-anos-recursos-2026',
            'title':'Milei endurece sanciones por Malvinas: propone hasta 20 años de prisión por explotar recursos',
            'summary':'El Gobierno argentino envió al Congreso un proyecto que amplía las sanciones por explotar recursos en Malvinas sin autorización argentina y crea un nuevo Sistema de Seguridad Nacional.',
            'category':'Argentina · Malvinas y soberanía',
            'date':'2026-09-17T13:08:00-03:00',
            'dateDisplay':'17 SEP 2026',
            'place':'Buenos Aires · Argentina',
            'image':'assets/news/milei-malvinas-presidencia-2026.jpg',
            'imageAlt':'Javier Milei durante el acto oficial por el Día del Veterano y de los Caídos en la Guerra de Malvinas',
            'photoCredit':'Presidencia de la Nación Argentina / Casa Rosada · archivo, 2 de abril de 2026',
            'url':'noticias/milei-malvinas-sanciones-20-anos-recursos-2026.html'
          }
          data=[x for x in data if x.get('id')!=story['id']]
          data.insert(0,story)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Publicar cambios
        run: |
          git config user.name 'Archivo Popular'
          git config user.email 'santiagoares3@gmail.com'
          git add data/noticias.json assets/news/milei-malvinas-presidencia-2026.jpg
          git commit -m 'Integra noticia de Milei y Malvinas al sitio'
          git push
