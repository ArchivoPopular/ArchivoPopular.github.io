name: Preview fotos Presidencia Tacuarembó 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-fotos-presidencia-tacuarembo-2026.yml'

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar fotos oficiales
        run: |
          mkdir -p /tmp/fotos
          curl -L --fail --retry 3 'https://medios.presidencia.gub.uy/tav_portal/2026/noticias/AP_146/_09A051213675.jpg.jpeg' -o /tmp/fotos/foto01.jpg
          curl -L --fail --retry 3 'https://medios.presidencia.gub.uy/tav_portal/2026/noticias/AP_146/_09A055613680.jpg.jpeg' -o /tmp/fotos/foto06.jpg
          curl -L --fail --retry 3 'https://medios.presidencia.gub.uy/tav_portal/2026/noticias/AP_146/_09A059713684.jpg.jpeg' -o /tmp/fotos/foto10.jpg
          curl -L --fail --retry 3 'https://medios.presidencia.gub.uy/tav_portal/2026/noticias/AP_146/_09A074213694.jpg.jpeg' -o /tmp/fotos/foto17.jpg
          curl -L --fail --retry 3 'https://medios.presidencia.gub.uy/tav_portal/2026/noticias/AP_146/_Y3A171813735.jpg.jpeg' -o /tmp/fotos/foto24.jpg
          curl -L --fail --retry 3 'https://medios.presidencia.gub.uy/tav_portal/2026/noticias/AP_146/_Y3A187713747.jpg.jpeg' -o /tmp/fotos/foto28.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: fotos-presidencia-tacuarembo
          path: /tmp/fotos
