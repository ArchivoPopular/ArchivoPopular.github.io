            <main id="contenido" class="page-main">
              <article class="wrapper article-shell">
                <header class="article-header">
                  <p class="eyebrow">Trabajo · Industria frigorífica</p>
                  <p class="story-meta"><span>4 DE SETIEMBRE DE 2026 · 14:52</span><span>Tacuarembó · Uruguay</span><span>Archivo Popular</span></p>
                  <h1>1.300 trabajadores en seguro de paro: Frigorífico Tacuarembó paraliza su actividad</h1>
                  <p class="article-deck">La planta incorporará a unos 550 trabajadores más al seguro de desempleo y quedará con cerca de 1.300 de sus 1.700 funcionarios amparados. La reestructura también mantiene abierta una disputa por puestos de trabajo, salarios y tercerizaciones.</p>
                </header>

                <figure class="article-figure">
                  <img src="../assets/news/frigorifico-tacuarembo-conflicto-subrayado-2026.jpg" alt="Trabajadores del Frigorífico Tacuarembó durante el conflicto laboral de setiembre de 2026" width="658" height="425">
                  <figcaption>Frigorífico Tacuarembó durante el conflicto laboral. Foto: Subrayado · 3 de setiembre de 2026.</figcaption>
                </figure>

                <div class="article-body">
                  <p>El Frigorífico Tacuarembó ampliará desde el martes 8 el envío de trabajadores al seguro de desempleo y llevará a cerca de 1.300 el número de funcionarios amparados, sobre una plantilla de alrededor de 1.700 personas. La planta dejará prácticamente detenida su actividad industrial, con tareas mínimas de mantenimiento y sectores puntuales.</p>

                  <p>La nueva tanda alcanza a unos 540 o 550 trabajadores, según las fuentes consultadas, y se suma a los cerca de 750 que ya habían ingresado al seguro de paro a comienzos de setiembre. La empresa atribuyó la caída de actividad a dificultades vinculadas al mercado chino y a la disponibilidad de ganado para faena.</p>

                  <p>El conflicto no se limita al seguro de paro. La reestructura discutida con el sindicato incluye una reducción de unos 150 puestos, cambios en los mecanismos salariales y la tercerización de servicios. Dirigentes de la Federación Obrera de la Industria de la Carne señalaron que dentro de esos 150 casos también podrían existir causales jubilatorias o retiros voluntarios, por lo que no todos implicarían necesariamente despidos directos.</p>

                  <p>La Asociación de Obreros y Empleados del Frigorífico Tacuarembó rechazó los despidos arbitrarios y la rebaja salarial. Su presidente, Hugo Gálvez, sostuvo que la reducción de ingresos planteada podría ubicarse entre 40% y 45% para sectores afectados y afirmó que el gremio está dispuesto a discutir mecanismos de eficiencia, pero no una salida basada en pérdida de puestos y salarios.</p>

                  <p>El escenario contrasta con lo ocurrido en abril. Entonces MBRF inauguró una ampliación de la planta e incorporó 570 trabajadores, llevando el empleo directo a unas 1.700 personas. La propia Presidencia presentó aquella expansión como una señal positiva para la inversión y el trabajo en el departamento.</p>

                  <p>La negociación seguirá en el Ministerio de Trabajo. Mientras tanto, la suspensión de actividad coloca a la mayoría de la plantilla bajo seguro de desempleo y vuelve a poner en el centro la discusión sobre quién absorbe el costo de las reestructuras empresariales en una de las principales industrias exportadoras del país.</p>
                </div>

                <aside class="article-aside" aria-labelledby="fuentes">
