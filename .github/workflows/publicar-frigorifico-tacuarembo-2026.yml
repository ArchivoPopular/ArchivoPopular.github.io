name: Publicar Frigorífico Tacuarembó 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-frigorifico-tacuarembo-2026.yml'

permissions:
  contents: write

jobs:
  publicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar dependencias
        run: |
          python -m pip install --upgrade pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core

      - name: Descargar fotografía real de Subrayado
        run: |
          curl -L --fail --retry 3 \
            'https://media.subrayado.com.uy/p/1c7d150f66cceeee584bb4bc340ceed9/adjuntos/230/imagenes/004/085/0004085991/658x425/smart/carnes-frigorifico-tacuarembo-conflicto.jpg' \
            -o /tmp/frigorifico-tacuarembo-subrayado.jpg
          file /tmp/frigorifico-tacuarembo-subrayado.jpg

      - name: Crear placa, nota e integración web
        run: |
          python <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import json, re, shutil, html

          root = Path('.')
          news_img = root / 'assets/news/frigorifico-tacuarembo-conflicto-subrayado-2026.jpg'
          social_img = root / 'assets/social/archivo-popular-frigorifico-tacuarembo-1300-seguro-paro-2026-master.png'
          social_img.parent.mkdir(parents=True, exist_ok=True)
          news_img.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2('/tmp/frigorifico-tacuarembo-subrayado.jpg', news_img)

          W, H = 2160, 2700
          PHOTO_H = 1590
          RED_Y = PHOTO_H
          RED_H = 12
          BLACK_TOP = RED_Y + RED_H
          FOOTER_Y = 2576
          red = '#E30613'
          black = '#050505'
          white = '#FFFFFF'
          gray = '#C8C5C2'

          src = Image.open(news_img).convert('RGB')
          ratio = max(W / src.width, PHOTO_H / src.height)
          resized = src.resize((round(src.width * ratio), round(src.height * ratio)), Image.Resampling.LANCZOS)
          left = max(0, (resized.width - W) // 2)
          top = max(0, (resized.height - PHOTO_H) // 2)
          photo = resized.crop((left, top, left + W, top + PHOTO_H))

          canvas = Image.new('RGB', (W, H), black)
          canvas.paste(photo, (0, 0))

          # Protección oscura suave detrás del logo.
          overlay = Image.new('RGBA', (W, 330), (0,0,0,0))
          od = ImageDraw.Draw(overlay)
          for y in range(330):
              a = int(90 * (1 - y / 330))
              od.line((0, y, W, y), fill=(0,0,0,a))
          canvas = Image.alpha_composite(canvas.convert('RGBA'), Image.new('RGBA', canvas.size, (0,0,0,0)))
          canvas.alpha_composite(overlay, (0, 0))

          # Logo original del sitio, sin deformación.
          logo = Image.open(root / 'logo.png').convert('RGBA')
          target_w = 610
          target_h = round(logo.height * target_w / logo.width)
          logo = logo.resize((target_w, target_h), Image.Resampling.LANCZOS)
          canvas.alpha_composite(logo, ((W-target_w)//2, 42))

          d = ImageDraw.Draw(canvas)
          d.rectangle((0, RED_Y, W, RED_Y + RED_H - 1), fill=red)
          d.rectangle((0, BLACK_TOP, W, FOOTER_Y - 1), fill=black)
          d.rectangle((0, FOOTER_Y, W, H), fill=white)
          d.rectangle((0, FOOTER_Y, 620, H), fill=red)

          bold = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          font_credit = ImageFont.truetype(bold, 34)
          font_head = ImageFont.truetype(bold, 106)
          font_meta = ImageFont.truetype(bold, 43)
          font_footer = ImageFont.truetype(bold, 48)
          font_handle = ImageFont.truetype(bold, 50)

          credit = 'FOTO: SUBRAYADO'
          cb = d.textbbox((0,0), credit, font=font_credit)
          cw = cb[2]-cb[0]
          ch = cb[3]-cb[1]
          cx, cy = 120, PHOTO_H - 78
          d.rectangle((cx, cy, cx + cw + 42, PHOTO_H), fill=white)
          d.text((cx+21, cy + (78-ch)//2 - cb[1]), credit, font=font_credit, fill='#111111')

          lines = [
              '1.300 TRABAJADORES',
              'EN SEGURO DE PARO:',
              'FRIGORÍFICO TACUAREMBÓ',
              'PARALIZA SU ACTIVIDAD'
          ]
          x = 120
          y = 1715
          line_gap = 25
          for line in lines:
              d.text((x, y), line, font=font_head, fill=white)
              box = d.textbbox((x, y), line, font=font_head)
              y = box[3] + line_gap

          date = '4 DE SETIEMBRE DE 2026'
          place = 'TACUAREMBÓ · URUGUAY'
          meta_y = 2470
          d.text((120, meta_y), date, font=font_meta, fill=red)
          pb = d.textbbox((0,0), place, font=font_meta)
          d.text((W-120-(pb[2]-pb[0]), meta_y), place, font=font_meta, fill=gray)

          d.text((176, 2606), 'NOTICIA', font=font_footer, fill=white)
          handle = '@archivopopular'
          hb = d.textbbox((0,0), handle, font=font_handle)
          d.text((W-120-(hb[2]-hb[0]), 2602), handle, font=font_handle, fill='#111111')

          canvas.convert('RGB').save(social_img, format='PNG', optimize=True)
          shutil.copy2(social_img, root / 'archivo-popular-frigorifico-tacuarembo-1300-seguro-paro-2026-master.png')

          story = {
            'id': 'frigorifico-tacuarembo-1300-seguro-paro-2026',
            'title': '1.300 trabajadores en seguro de paro: Frigorífico Tacuarembó paraliza su actividad',
            'summary': 'La planta incorporará a unos 550 trabajadores más al seguro de desempleo y quedará con cerca de 1.300 de sus 1.700 funcionarios amparados. La reestructura también mantiene abierta una disputa por puestos de trabajo, salarios y tercerizaciones.',
            'category': 'Trabajo · Industria frigorífica',
            'date': '2026-09-04T14:52:00-03:00',
            'dateDisplay': '4 SEP 2026',
            'place': 'Tacuarembó · Uruguay',
            'image': 'assets/news/frigorifico-tacuarembo-conflicto-subrayado-2026.jpg',
            'imageAlt': 'Trabajadores del Frigorífico Tacuarembó durante el conflicto laboral de setiembre de 2026',
            'photoCredit': 'Subrayado · 3 de setiembre de 2026',
            'url': 'noticias/frigorifico-tacuarembo-1300-seguro-paro-2026.html'
          }

