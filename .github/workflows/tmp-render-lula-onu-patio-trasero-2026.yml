name: Render Lula ONU soberania 2026

on:
  push:
    paths:
      - 'tmp-render-lula-onu-patio-trasero-2026.svg'
      - '.github/workflows/tmp-render-lula-onu-patio-trasero-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-urw-base35
      - name: Descargar fotografía periodística real
        run: |
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://www.aljazeera.com/wp-content/uploads/2026/09/afp_6ab2ac0a556d-1790094346.jpg?quality=80&resize=770%2C513' -o lula-onu-photo.jpg
          identify lula-onu-photo.jpg
          cp logo.png archivo-popular-logo-master.png
      - name: Renderizar PNG master
        run: |
          rsvg-convert -w 2160 -h 2700 tmp-render-lula-onu-patio-trasero-2026.svg -o archivo-popular-lula-onu-patio-trasero-2026-master.png
          identify archivo-popular-lula-onu-patio-trasero-2026-master.png
      - name: Integrar foto, placa e índice al sitio
        run: |
          mkdir -p assets/news assets/cards
          cp lula-onu-photo.jpg assets/news/lula-onu-timothy-clary-afp-2026.jpg
          cp archivo-popular-lula-onu-patio-trasero-2026-master.png assets/cards/archivo-popular-lula-onu-patio-trasero-2026-master.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/noticias.json')
          data=json.loads(p.read_text())
          story={
            'id':'lula-onu-brasil-no-es-patio-trasero-2026',
            'title':'Lula rechaza la injerencia externa en la ONU: “Brasil no es el patio trasero de nadie”',
            'summary':'Lula advirtió contra la interferencia extranjera en las elecciones de Brasil, cuestionó las ambiciones hegemónicas en América Latina y defendió la soberanía regional en la Asamblea General de la ONU.',
            'category':'Brasil · ONU · Soberanía regional',
            'date':'2026-09-23T18:13:00-03:00',
            'dateDisplay':'23 SEP 2026',
            'place':'Nueva York · Estados Unidos',
            'image':'assets/news/lula-onu-timothy-clary-afp-2026.jpg',
            'imageAlt':'Luiz Inácio Lula da Silva habla ante la Asamblea General de Naciones Unidas en Nueva York',
            'photoCredit':'Timothy A. Clary / AFP · publicada por Al Jazeera',
            'url':'noticias/lula-onu-brasil-no-es-patio-trasero-2026.html'
          }
          data=[story]+[x for x in data if x.get('id')!=story['id']]
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          s=Path('sitemap.xml')
          txt=s.read_text()
          url='https://archivopopular.github.io/noticias/lula-onu-brasil-no-es-patio-trasero-2026.html'
          if url not in txt:
              txt=txt.replace('</urlset>',f'  <url><loc>{url}</loc><lastmod>2026-09-23</lastmod></url>\n</urlset>')
              s.write_text(txt)
          PY
          git config user.name 'Archivo Popular'
          git config user.email 'santiagoares3@gmail.com'
          git add assets/news/lula-onu-timothy-clary-afp-2026.jpg assets/cards/archivo-popular-lula-onu-patio-trasero-2026-master.png data/noticias.json sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Integra discurso de Lula en la ONU y placa master'
            git pull --rebase --autostash origin main
            git push
          fi
      - name: Subir PNG master
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-lula-onu-patio-trasero-2026
          path: archivo-popular-lula-onu-patio-trasero-2026-master.png
          retention-days: 7
