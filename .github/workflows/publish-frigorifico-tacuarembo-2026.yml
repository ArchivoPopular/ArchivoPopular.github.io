name: Publicar Frigorífico Tacuarembó 2026

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-frigorifico-tacuarembo-2026.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependencias
        run: python -m pip install --quiet pillow

      - name: Generar publicación
        run: python scripts/publish_frigorifico_2026.py

      - name: Commit
        run: |
          git config user.name "Archivo Popular Bot"
          git config user.email "archivo-popular@users.noreply.github.com"
          git add assets/news/frigorifico-tacuarembo-seguro-paro-2026.jpg
          git add assets/social/archivo-popular-frigorifico-tacuarembo-seguro-paro-2026-master.png
          git add noticias/frigorifico-tacuarembo-1300-seguro-paro-2026.html
          git add data/noticias.json data/buscador.json index.html noticias.html feed.xml sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Publicar crisis laboral en Frigorífico Tacuarembó"
            git push origin HEAD:main
          fi
