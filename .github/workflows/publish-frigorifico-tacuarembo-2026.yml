name: Publicar Frigorífico Tacuarembó 2026

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-frigorifico-tacuarembo-2026.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrar noticia en la web
        run: python scripts/publish_frigorifico_web_2026.py

      - name: Commit y push
        run: |
          git config user.name "Archivo Popular Bot"
          git config user.email "archivo-popular@users.noreply.github.com"
          git add noticias/frigorifico-tacuarembo-1300-seguro-paro-2026.html
          git add data/noticias.json data/buscador.json index.html noticias.html feed.xml sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Publicar crisis laboral en Frigorífico Tacuarembó"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
