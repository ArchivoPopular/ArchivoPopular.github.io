name: Publicar condena citrícola Paysandú 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-citricos-paysandu-2026.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-urw-base35
          python -m pip install --quiet pillow

      - name: Descargar fotografía oficial
        run: |
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://www.gub.uy/presidencia/sites/presidencia/files/inline-images/Portadas%20Gubuy%20%289%29_5.png' -o /tmp/citricos.png
          file /tmp/citricos.png

      - name: Crear noticia, imagen web y placa
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, re, html, subprocess

          root=Path('.')
          slug='condena-tercerizada-trabajadores-citricos-paysandu-2026'
          title='Condenan al dueño y al capataz de una tercerizada por poner en riesgo a trabajadores en Paysandú'
          summary='La Justicia condenó a los responsables de Service Work SAS, tercerizada contratada por Sanducitrus, por omitir medidas de seguridad en la cosecha. El dueño de Sanducitrus continúa bajo investigación.'
          category='Trabajo · Derechos laborales'
          date_iso='2026-09-06T15:48:00-03:00'
          date_display='6 SEP 2026'
          place='Paysandú · Uruguay'
          image_rel='assets/news/citricos-paysandu-ignacio-turell-presidencia-2026.jpg'
          social_rel='assets/social/archivo-popular-citricos-paysandu-condena-2026-master.png'
          article_rel=f'noticias/{slug}.html'
          url=f'https://archivopopular.github.io/{article_rel}'
          photo_credit='Ignacio Turell / Presidencia de la República · Archivo, 23 de junio de 2026'
          image_alt='Trabajadores durante la zafra citrícola 2026 en Gallinal, Paysandú'

          # Imagen web real, de archivo y de uso libre según Presidencia.
          im=Image.open('/tmp/citricos.png').convert('RGB')
          target_w=1600
          if im.width > target_w:
              h=round(im.height*target_w/im.width)
              im=im.resize((target_w,h), Image.Resampling.LANCZOS)
          out=root/image_rel
          out.parent.mkdir(parents=True, exist_ok=True)
          im.save(out, quality=92, optimize=True)

          # Crop fotográfico para la placa 2160x1590.
          src=Image.open('/tmp/citricos.png').convert('RGB')
          W,PH=2160,1590
          scale=max(W/src.width, PH/src.height)
          resized=src.resize((round(src.width*scale), round(src.height*scale)), Image.Resampling.LANCZOS)
          left=max(0,(resized.width-W)//2)
          top=max(0,(resized.height-PH)//2)
          crop=resized.crop((left,top,left+W,top+PH))
          crop.save('/tmp/citricos-crop.jpg',quality=96)

          # Placa: geometría exacta de la plantilla master de Archivo Popular.
          logo=(root/'logo.png').resolve().as_uri()
          photo=Path('/tmp/citricos-crop.jpg').resolve().as_uri()
          svg=f'''<svg width="2160" height="2700" viewBox="0 0 2160 2700" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="topShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000000" stop-opacity="0.70"/><stop offset="0.72" stop-color="#000000" stop-opacity="0"/></linearGradient></defs>
          <rect width="2160" height="2700" fill="#F3F0E9"/>
          <image x="0" y="0" width="2160" height="1590" href="{photo}" preserveAspectRatio="xMidYMid slice"/>
          <rect x="0" y="0" width="2160" height="520" fill="url(#topShade)"/>
          <image x="800" y="42" width="560" height="181" href="{logo}" preserveAspectRatio="xMidYMid meet"/>
          <rect x="120" y="1510" width="1260" height="80" fill="#FFFFFF"/>
          <text x="154" y="1562" fill="#090909" font-family="Nimbus Sans" font-size="32" font-weight="700" letter-spacing="3">FOTO DE ARCHIVO: IGNACIO TURELL / PRESIDENCIA</text>
          <rect x="0" y="1590" width="2160" height="986" fill="#090909"/>
          <rect x="0" y="1590" width="2160" height="12" fill="#E30613"/>
          <text x="120" y="1782" fill="#FFFFFF" font-family="Nimbus Sans" font-size="150" font-weight="700" letter-spacing="-2">
            <tspan x="120" dy="0">DUEÑO Y CAPATAZ</tspan>
            <tspan x="120" dy="172">CONDENADOS POR</tspan>
            <tspan x="120" dy="172">RIESGO LABORAL EN</tspan>
            <tspan x="120" dy="172">LA ZAFRA CITRÍCOLA</tspan>
          </text>
          <text x="120" y="2510" fill="#E30613" font-family="Nimbus Sans" font-size="48" font-weight="700" letter-spacing="2.5">6 DE SETIEMBRE DE 2026</text>
          <text x="2040" y="2510" text-anchor="end" fill="#BEBAB2" font-family="Nimbus Sans" font-size="48" font-weight="600" letter-spacing="2">PAYSANDÚ · URUGUAY</text>
          <rect x="0" y="2576" width="2160" height="124" fill="#FFFFFF"/>
          <rect x="0" y="2576" width="620" height="124" fill="#E30613"/>
          <text x="310" y="2657" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans" font-size="58" font-weight="700" letter-spacing="5">NOTICIA</text>
          <text x="2040" y="2657" text-anchor="end" fill="#090909" font-family="Nimbus Sans" font-size="62" font-weight="700" letter-spacing="2">@archivopopular</text>
          </svg>'''
          Path('/tmp/plate.svg').write_text(svg,encoding='utf-8')
          social=root/social_rel
          social.parent.mkdir(parents=True,exist_ok=True)
          subprocess.run(['rsvg-convert','-w','2160','-h','2700','-o',str(social),'/tmp/plate.svg'],check=True)

          # Artículo.
          article=f'''<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#090909">
<meta name="description" content="{html.escape(summary, quote=True)}">
<meta property="og:type" content="article"><meta property="og:title" content="{html.escape(title, quote=True)}"><meta property="og:description" content="{html.escape(summary, quote=True)}"><meta property="og:image" content="https://archivopopular.github.io/{image_rel}">
<meta property="article:published_time" content="{date_iso}"><link rel="canonical" href="{url}"><link rel="stylesheet" href="../styles.css?v=20260828-1">
<title>{html.escape(title)} | Archivo Popular</title>
</head><body>
<a class="skip-link" href="#contenido">Saltar al contenido</a>
<header class="site-header"><div class="wrapper topline"><span>Montevideo · Uruguay · Desde 2023</span><span>Noticias, memoria y fotografía</span></div><div class="wrapper brandbar"><a class="brand" href="../index.html" aria-label="Archivo Popular, inicio"><img src="../logo.png" alt="Archivo Popular" width="2269" height="713"></a><nav class="site-nav" aria-label="Navegación principal" data-open="false"><ul><li><a href="../index.html">Inicio</a></li><li><a href="../noticias.html" aria-current="page">Noticias</a></li><li><a href="../personajes.html">Archivo político</a></li><li><a href="../historia.html">Historia</a></li><li><a href="../fotografos.html">Fotógrafos</a></li><li><a href="../index.html#nosotros">Nosotros</a></li></ul></nav><button class="menu-button" type="button" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span><span></span></button></div></header>
<main id="contenido" class="page-main"><article class="wrapper article-shell"><header class="article-header"><p class="eyebrow">{category}</p><p class="story-meta"><span>6 DE SETIEMBRE DE 2026 · 15:48</span><span>{place}</span><span>Archivo Popular</span></p><h1>{title}</h1><p class="article-deck">{summary}</p></header>
<figure class="article-figure"><img src="../{image_rel}" alt="{image_alt}" width="1600" loading="eager"><figcaption>Trabajadores durante la zafra citrícola 2026 en Gallinal, Paysandú. Foto de archivo: Ignacio Turell / Presidencia de la República · 23 de junio de 2026. La imagen no corresponde al establecimiento investigado.</figcaption></figure>
<div class="article-body">
<p>La Justicia condenó al dueño y al capataz de Service Work SAS, una empresa tercerizada contratada por Sanducitrus para organizar cuadrillas de cosecha, por omitir medidas de seguridad y exponer a trabajadores a riesgos graves durante las zafras citrícolas de 2024 y 2025 en Paysandú.</p>
<p>Los fallos establecieron que la cosecha manual se realizaba con escaleras de considerable peso y diseño deficiente, sobre terrenos irregulares y muy húmedos. A pesar del riesgo de la tarea, los responsables no entregaron los elementos de protección necesarios ni retiraron escaleras que no estaban en condiciones.</p>
<p>La Justicia también constató que ambos conocían la existencia de accidentes y no modificaron las condiciones de trabajo. Hubo laceraciones, heridas por las espinas de los árboles y caídas con lesiones graves. En uno de los casos, un trabajador quedó imposibilitado de caminar. Los trabajadores argentinos no contaban con el seguro obligatorio de accidentes de trabajo y, ante lesiones, eran trasladados a Concordia en lugar de recibir atención médica inmediata en Paysandú.</p>
<p>El capataz fue condenado el 20 de agosto, en proceso abreviado, a seis meses de prisión: 15 días de cumplimiento efectivo y el resto en libertad a prueba. Debido al tiempo que ya había permanecido en prisión preventiva y bajo otras medidas, la pena se consideró cumplida. Días antes, el dueño de Service Work SAS recibió cuatro meses de prisión bajo régimen de libertad a prueba, con tobillera electrónica, tareas comunitarias y otras restricciones.</p>
<p>El expediente surgió a partir del operativo realizado en diciembre de 2025 por Fiscalía, Policía —incluida Interpol— y la Inspección General del Trabajo. El Ministerio de Trabajo informó entonces que fueron relevados 38 trabajadores argentinos, 14 peruanos y siete uruguayos. La mayoría se encontraba sin registrar en la seguridad social y se detectaron condiciones laborales y habitacionales que el inspector general Luis Puig calificó como “absolutamente deplorables”.</p>
<p>En el establecimiento rural se constataron 18 irregularidades de seguridad y salud, entre ellas falta de agua potable y alimentación adecuada. También se encontraron instalaciones eléctricas precarias, herramientas sin protección, problemas de higiene y dormitorios y baños en malas condiciones. El Ministerio clausuró preventivamente las instalaciones de vivienda y bienestar.</p>
<p>La investigación inicial incluyó hipótesis de reducción a esclavitud, servidumbre o trabajo forzoso y una posible organización de trata de personas. Después de más de seis meses de investigación, esas figuras no pudieron ser acreditadas. Los condenados fueron responsabilizados por delitos previstos en la Ley 19.196 de responsabilidad penal empresarial, vinculados a la omisión de medidas de seguridad laboral.</p>
<p>El caso todavía no está cerrado. El fiscal Joaquín Suárez indicó que resta investigar al dueño de Sanducitrus por eventuales responsabilidades bajo la misma ley. Por eso, la condena alcanzó por ahora a los responsables de la tercerizada y no constituye una condena judicial contra Sanducitrus.</p>
<p>La citricultura es una actividad de fuerte peso laboral en el litoral. Según datos oficiales presentados este año, el sector involucra unos 15.000 puestos de trabajo directos en Uruguay. La dimensión económica de la actividad vuelve especialmente relevante el control de las condiciones de seguridad, formalización y alojamiento de quienes sostienen las zafras.</p>
</div>
<aside class="article-aside" aria-labelledby="fuentes"><h2 id="fuentes">Fuentes consultadas</h2><ul class="source-list">
<li><a href="https://www.elpais.com.uy/informacion/judiciales/justicia-condena-a-empresario-y-capataz-por-poner-en-riesgo-a-trabajadores-en-citricola-de-paysandu" rel="noopener" target="_blank">El País · fallos, condenas y estado de la investigación</a></li>
<li><a href="https://www.gub.uy/ministerio-trabajo-seguridad-social/comunicacion/noticias/operativo-conjunto-paysandu-constato-grave-situacion-explotacion-laboral" rel="noopener" target="_blank">MTSS · operativo e irregularidades constatadas en diciembre de 2025</a></li>
<li><a href="https://paysanduonline.uy/noticia/condenaron-a-un-empresario-y-a-un-capataz-por-poner-en-riesgo-a-trabajadores-en-una-citricola-de-paysandu" rel="noopener" target="_blank">Paysandú Online · cobertura local de las condenas</a></li>
<li><a href="https://www.gub.uy/presidencia/comunicacion/publicaciones/presidente-orsi-participo-inauguracion-zafra-citricola-2026" rel="noopener" target="_blank">Presidencia · fotografía de archivo, crédito y términos de uso</a></li>
</ul></aside></article></main>
<footer class="site-footer"><div class="wrapper footer-grid"><div class="footer-brand"><img src="../logo.png" alt="Archivo Popular" width="2269" height="713"><p>Noticias políticas, memoria y fotografía desde Uruguay con una mirada popular y latinoamericana.</p></div><div class="footer-column"><h2>Secciones</h2><ul><li><a href="../noticias.html">Noticias</a></li><li><a href="../personajes.html">Archivo político</a></li><li><a href="../historia.html">Historia de las izquierdas</a></li><li><a href="../fotografos.html">Nuestros fotógrafos</a></li></ul></div><div class="footer-column"><h2>Seguinos</h2><ul><li><a href="https://www.instagram.com/archivopopular/" rel="me noopener" target="_blank">Instagram</a></li><li><a href="https://www.facebook.com/profile.php?id=61560610077791" rel="noopener" target="_blank">Facebook</a></li><li><a href="https://www.tiktok.com/@archivopopular" rel="noopener" target="_blank">TikTok</a></li></ul></div></div><div class="wrapper footer-bottom"><span>Archivo Popular © <span data-current-year>2026</span></span><span>Montevideo, Uruguay</span></div></footer><script src="../site.js?v=20260828-1" defer></script>
</body></html>'''
          article_path=root/article_rel
          article_path.parent.mkdir(parents=True,exist_ok=True)
          article_path.write_text(article,encoding='utf-8')

          # data/noticias.json
          data_path=root/'data/noticias.json'
          data=json.loads(data_path.read_text(encoding='utf-8'))
          data=[x for x in data if x.get('id')!=slug]
          data.insert(0,{'id':slug,'title':title,'summary':summary,'category':category,'date':date_iso,'dateDisplay':date_display,'place':place,'image':image_rel,'imageAlt':image_alt,'photoCredit':photo_credit,'url':article_rel})
          data_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Portada estática de respaldo + OG
          index_path=root/'index.html'
          idx=index_path.read_text(encoding='utf-8')
          idx=re.sub(r'<meta property="og:image" content="[^"]+">',f'<meta property="og:image" content="https://archivopopular.github.io/{image_rel}">',idx,count=1)
          lead=f'''<article class="lead-story" data-latest-story aria-live="polite">\n      <figure>\n        <img src="{image_rel}" alt="{image_alt}" width="658" height="425">\n        <figcaption class="photo-credit">Foto: {photo_credit}</figcaption>\n      </figure>\n      <div class="lead-copy">\n        <p class="story-meta"><span>{date_display}</span><span>{place}</span></p>\n        <h1 id="ultima-noticia">{title}</h1>\n        <p class="summary">{summary}</p>\n        <a class="story-link" href="{article_rel}">Leer la noticia completa</a>\n      </div>\n    </article>'''
          idx=re.sub(r'<article class="lead-story" data-latest-story aria-live="polite">.*?</article>',lead,idx,count=1,flags=re.S)
          index_path.write_text(idx,encoding='utf-8')

          # Noticias fallback
          news_path=root/'noticias.html'
          news=news_path.read_text(encoding='utf-8')
          card=f'''\n          <a class="news-card" href="{article_rel}">\n            <figure><img src="{image_rel}" alt="{image_alt}" width="1600" loading="lazy"></figure>\n            <div class="news-card__body"><p class="eyebrow">{category}</p><h2>{title}</h2><p>{summary}</p><p class="story-meta"><span>{date_display}</span><span>{place}</span></p></div>\n          </a>'''
          marker='<div class="news-grid" data-news-grid aria-live="polite">'
          if article_rel not in news:
              news=news.replace(marker,marker+card,1)
          news_path.write_text(news,encoding='utf-8')

          # Feed
          feed_path=root/'feed.xml'
          feed=feed_path.read_text(encoding='utf-8')
          feed=re.sub(r'<lastBuildDate>.*?</lastBuildDate>','<lastBuildDate>Sun, 06 Sep 2026 18:48:00 GMT</lastBuildDate>',feed,count=1)
          item=f'''\n    <item>\n      <title>{html.escape(title)}</title>\n      <link>{url}</link>\n      <guid isPermaLink="true">{url}</guid>\n      <pubDate>Sun, 06 Sep 2026 18:48:00 GMT</pubDate>\n      <description>{html.escape(summary)}</description>\n    </item>'''
          if url not in feed:
              feed=feed.replace('<item>',item+'\n    <item>',1)
          feed_path.write_text(feed,encoding='utf-8')

          # Sitemap
          sm_path=root/'sitemap.xml'
          sm=sm_path.read_text(encoding='utf-8')
          sm=sm.replace('<url><loc>https://archivopopular.github.io/</loc><lastmod>2026-09-06</lastmod>','<url><loc>https://archivopopular.github.io/</loc><lastmod>2026-09-06</lastmod>',1)
          entry=f'  <url><loc>{url}</loc><lastmod>2026-09-06</lastmod><changefreq>monthly</changefreq><priority>0.8</priority></url>\n'
          if url not in sm:
              sm=sm.replace('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'+entry,1)
          sm_path.write_text(sm,encoding='utf-8')
          PY

          node scripts/generar-buscador.mjs

      - name: Commit
        run: |
          git config user.name 'ArchivoPopular'
          git config user.email 'santiagoares3@gmail.com'
          git add assets/news/citricos-paysandu-ignacio-turell-presidencia-2026.jpg assets/social/archivo-popular-citricos-paysandu-condena-2026-master.png noticias/condena-tercerizada-trabajadores-citricos-paysandu-2026.html data/noticias.json data/buscador.json index.html noticias.html feed.xml sitemap.xml
          git commit -m 'Publicar condena por riesgo laboral en zafra citrícola de Paysandú'
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-citricos-paysandu-condena-master
          path: assets/social/archivo-popular-citricos-paysandu-condena-2026-master.png
