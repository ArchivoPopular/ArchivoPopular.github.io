name: Publicar condena citrícola Paysandú 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-citricos-paysandu-2026.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-urw-base35
          python -m pip install --quiet pillow
      - name: Descargar fotografía oficial
        run: curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://www.gub.uy/presidencia/sites/presidencia/files/inline-images/Portadas%20Gubuy%20%289%29_5.png' -o /tmp/citricos.png
      - name: Ejecutar publicación
        run: |
          echo '' | base64 -d > /tmp/publish.py
          python /tmp/publish.py
          node scripts/generar-buscador.mjs
      - name: Commit
        run: |
          git config user.name 'ArchivoPopular'
          git config user.email 'santiagoares3@gmail.com'
          git add assets/news/citricos-paysandu-ignacio-turell-presidencia-2026.jpg assets/social/archivo-popular-citricos-paysandu-condena-2026-master.png noticias/condena-tercerizada-trabajadores-citricos-paysandu-2026.html data/noticias.json data/buscador.json index.html noticias.html feed.xml sitemap.xml
          git commit -m 'Publicar condena por riesgo laboral en zafra citrícola de Paysandú'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-citricos-paysandu-condena-master
          path: assets/social/archivo-popular-citricos-paysandu-condena-2026-master.png
