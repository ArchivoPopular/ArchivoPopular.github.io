name: Publicar Fernando Pereira 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-fernando-pereira-2026.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar imagen y noticia
        run: |
          python -m pip install --quiet pillow
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Fernando_Pereira_Kosec.jpg' -o /tmp/fernando-pereira.jpg
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, re, html

          root=Path('.')
          slug='fernando-pereira-continuidad-presidencia-frente-amplio-2026'
          title='Fernando Pereira fue propuesto por unanimidad para continuar al frente del Frente Amplio'
          summary='El Plenario Nacional del Frente Amplio respaldó por unanimidad la continuidad de Pereira y elevó su nombre al Congreso José “Pepe” Mujica, que tendrá la decisión final entre el 16 y el 18 de octubre.'
          category='Política nacional · Frente Amplio'
          date_iso='2026-09-06T15:31:00-03:00'
          date_display='6 SEP 2026'
          place='Montevideo · Uruguay'
          image_rel='assets/news/fernando-pereira-pitcnt-wikimedia-2015.jpg'
          article_rel=f'noticias/{slug}.html'
          url=f'https://archivopopular.github.io/{article_rel}'
          image_alt='Fernando Pereira durante una actividad del PIT-CNT en una fotografía de archivo de 2015'
          photo_credit='PIT-CNT / Wikimedia Commons · Archivo, 14 de julio de 2015'

          # Imagen web
          out=root/image_rel
          out.parent.mkdir(parents=True, exist_ok=True)
          im=Image.open('/tmp/fernando-pereira.jpg').convert('RGB')
          w=1600
          h=round(im.height*w/im.width)
          im=im.resize((w,h), Image.Resampling.LANCZOS)
          im.save(out, quality=91, optimize=True)

          article=f'''<!doctype html>
          <html lang="es-UY">
          <head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#090909">
          <meta name="description" content="{html.escape(summary, quote=True)}">
          <meta property="og:type" content="article"><meta property="og:title" content="{html.escape(title, quote=True)}"><meta property="og:description" content="{html.escape(summary, quote=True)}"><meta property="og:image" content="https://archivopopular.github.io/{image_rel}">
          <meta property="article:published_time" content="{date_iso}"><link rel="canonical" href="{url}"><link rel="stylesheet" href="../styles.css?v=20260828-1">
          <title>{title} | Archivo Popular</title>
          </head><body>
          <a class="skip-link" href="#contenido">Saltar al contenido</a>
          <header class="site-header"><div class="wrapper topline"><span>Montevideo · Uruguay · Desde 2023</span><span>Noticias, memoria y fotografía</span></div><div class="wrapper brandbar"><a class="brand" href="../index.html" aria-label="Archivo Popular, inicio"><img src="../logo.png" alt="Archivo Popular" width="2269" height="713"></a><nav class="site-nav" aria-label="Navegación principal" data-open="false"><ul><li><a href="../index.html">Inicio</a></li><li><a href="../noticias.html" aria-current="page">Noticias</a></li><li><a href="../personajes.html">Archivo político</a></li><li><a href="../historia.html">Historia</a></li><li><a href="../fotografos.html">Fotógrafos</a></li><li><a href="../index.html#nosotros">Nosotros</a></li></ul></nav><button class="menu-button" type="button" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span><span></span></button></div></header>
          <main id="contenido" class="page-main"><article class="wrapper article-shell"><header class="article-header"><p class="eyebrow">{category}</p><p class="story-meta"><span>6 DE SETIEMBRE DE 2026 · 15:31</span><span>{place}</span><span>Archivo Popular</span></p><h1>{title}</h1><p class="article-deck">{summary}</p></header>
          <figure class="article-figure"><img src="../{image_rel}" alt="{image_alt}" width="1600" height="1063"><figcaption>Fernando Pereira durante una actividad del PIT-CNT. Foto de archivo: PIT-CNT / Wikimedia Commons · 14 de julio de 2015 · CC BY-SA 4.0.</figcaption></figure>
          <div class="article-body">
          <p>El Plenario Nacional del Frente Amplio resolvió por unanimidad proponer a Fernando Pereira para continuar en la Presidencia de la fuerza política. La decisión fue adoptada el sábado 5 de setiembre y eleva formalmente su nombre al VIII Congreso Ordinario José “Pepe” Mujica.</p>
          <p>La definición todavía no equivale a una reelección consumada. El Congreso del Frente Amplio, previsto para los días 16, 17 y 18 de octubre en el Palacio Peñarol, tendrá la palabra final sobre la Presidencia y las Vicepresidencias. La resolución oficial señala que existen amplios acuerdos alrededor del nombre de Pereira.</p>
          <p>Las Vicepresidencias todavía no están cerradas. El Frente Amplio prevé trabajar sus nombres en un próximo Plenario Nacional antes del Congreso. También quedó fijado para el domingo 12 de setiembre de 2027 el acto electoral del próximo Plenario Nacional y de las presidencias y plenarios departamentales.</p>
          <p>Pereira ocupa la Presidencia del Frente Amplio desde febrero de 2022. En las elecciones internas celebradas en diciembre de 2021 obtuvo el 67,2% de los votos, con 88.959 sufragios, y asumió después de una trayectoria de años en la dirección del PIT-CNT.</p>
          <p>La unanimidad del Plenario consolida un acuerdo que venía construyéndose durante los últimos meses dentro de la coalición de izquierda. El respaldo evita, por ahora, una disputa abierta por la conducción partidaria en un momento en que el Frente Amplio también es la fuerza que sostiene al gobierno nacional.</p>
          <p>Tras la resolución, Pereira puso el foco en reforzar el vínculo entre partido, gobierno y sociedad. Planteó ampliar las instancias de escucha en el interior y sostuvo que la organización política debe contribuir a sostener un ciclo progresista con participación social, además de acompañar la gestión del Ejecutivo.</p>
          <p>El próximo paso será el Congreso de octubre. Allí se deberá ratificar la Presidencia y definir la integración completa de la nueva conducción, mientras el Frente Amplio prepara un proceso de asambleas y movilización interna previo a esa instancia.</p>
          </div>
          <aside class="article-aside" aria-labelledby="fuentes"><h2 id="fuentes">Fuentes consultadas</h2><ul class="source-list">
          <li><a href="https://www.frenteamplio.uy/plenario-nacional-resolvio-por-unanimidad-proponer-al-congreso-que-fernando-pereira-continue-como-presidente-del-frente-amplio/" rel="noopener" target="_blank">Frente Amplio · resolución del Plenario Nacional</a></li>
          <li><a href="https://www.montevideo.com.uy/Noticias/Plenario-Nacional-del-FA-propuso-a-Fernando-Pereira-como-candidato-unico-a-presidente-uc974227" rel="noopener" target="_blank">Montevideo Portal · votación y antecedentes</a></li>
          <li><a href="https://www.teledoce.com/telemundo/nacionales/plenario-del-frente-amplio-aprobo-por-unanimidad-la-candidatura-de-fernando-pereira-para-ser-reelecto-como-presidente-del-partido/" rel="noopener" target="_blank">Teledoce · declaraciones de Pereira y fecha del Congreso</a></li>
          <li><a href="https://commons.wikimedia.org/wiki/File:Fernando_Pereira_Kosec.jpg" rel="noopener" target="_blank">Wikimedia Commons · fotografía de archivo y licencia CC BY-SA 4.0</a></li>
          </ul></aside></article></main>
          <footer class="site-footer"><div class="wrapper footer-grid"><div class="footer-brand"><img src="../logo.png" alt="Archivo Popular" width="2269" height="713"><p>Noticias políticas, memoria y fotografía desde Uruguay con una mirada popular y latinoamericana.</p></div><div class="footer-column"><h2>Secciones</h2><ul><li><a href="../noticias.html">Noticias</a></li><li><a href="../personajes.html">Archivo político</a></li><li><a href="../historia.html">Historia de las izquierdas</a></li><li><a href="../fotografos.html">Nuestros fotógrafos</a></li></ul></div><div class="footer-column"><h2>Seguinos</h2><ul><li><a href="https://www.instagram.com/archivopopular/" rel="me noopener" target="_blank">Instagram</a></li><li><a href="https://www.facebook.com/profile.php?id=61560610077791" rel="noopener" target="_blank">Facebook</a></li><li><a href="https://www.tiktok.com/@archivopopular" rel="noopener" target="_blank">TikTok</a></li></ul></div></div><div class="wrapper footer-bottom"><span>Archivo Popular © <span data-current-year>2026</span></span><span>Montevideo, Uruguay</span></div></footer><script src="../site.js?v=20260828-1" defer></script>
          </body></html>'''
          article_path=root/article_rel
          article_path.parent.mkdir(parents=True, exist_ok=True)
          article_path.write_text(article, encoding='utf-8')

          # data/noticias.json
          data_path=root/'data/noticias.json'
          data=json.loads(data_path.read_text(encoding='utf-8'))
          data=[x for x in data if x.get('id')!=slug]
          data.insert(0,{
            'id':slug,'title':title,'summary':summary,'category':category,'date':date_iso,
            'dateDisplay':date_display,'place':place,'image':image_rel,'imageAlt':image_alt,
            'photoCredit':photo_credit,'url':article_rel
          })
          data_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding='utf-8')

          # Portada estática de respaldo + OG
          index_path=root/'index.html'
          idx=index_path.read_text(encoding='utf-8')
          idx=re.sub(r'<meta property="og:image" content="[^"]+">', f'<meta property="og:image" content="https://archivopopular.github.io/{image_rel}">', idx, count=1)
          lead=f'''<article class="lead-story" data-latest-story aria-live="polite">\n      <figure>\n        <img src="{image_rel}" alt="{image_alt}" width="658" height="425">\n        <figcaption class="photo-credit">Foto: {photo_credit}</figcaption>\n      </figure>\n      <div class="lead-copy">\n        <p class="story-meta"><span>{date_display}</span><span>{place}</span></p>\n        <h1 id="ultima-noticia">{title}</h1>\n        <p class="summary">{summary}</p>\n        <a class="story-link" href="{article_rel}">Leer la noticia completa</a>\n      </div>\n    </article>'''
          idx=re.sub(r'<article class="lead-story" data-latest-story aria-live="polite">.*?</article>', lead, idx, count=1, flags=re.S)
          index_path.write_text(idx,encoding='utf-8')

          # Noticias estática de respaldo
          news_path=root/'noticias.html'
          news=news_path.read_text(encoding='utf-8')
          card=f'''\n          <a class="news-card" href="{article_rel}">\n            <figure><img src="{image_rel}" alt="{image_alt}" width="1600" height="1063"></figure>\n            <div class="news-card__body"><p class="eyebrow">{category}</p><h2>{title}</h2><p>{summary}</p><p class="story-meta"><span>{date_display}</span><span>{place}</span></p></div>\n          </a>'''
          marker='<div class="news-grid" data-news-grid aria-live="polite">'
          if article_rel not in news:
              news=news.replace(marker, marker+card, 1)
          news_path.write_text(news,encoding='utf-8')

          # RSS
          feed_path=root/'feed.xml'
          feed=feed_path.read_text(encoding='utf-8')
          feed=re.sub(r'<lastBuildDate>.*?</lastBuildDate>', '<lastBuildDate>Sun, 06 Sep 2026 18:31:00 GMT</lastBuildDate>', feed, count=1)
          item=f'''\n    <item>\n      <title>{html.escape(title)}</title>\n      <link>{url}</link>\n      <guid isPermaLink="true">{url}</guid>\n      <pubDate>Sun, 06 Sep 2026 18:31:00 GMT</pubDate>\n      <description>{html.escape(summary)}</description>\n    </item>'''
          if url not in feed:
              feed=feed.replace('</lastBuildDate>', '</lastBuildDate>'+item, 1)
          feed_path.write_text(feed,encoding='utf-8')

          # Sitemap
          sitemap_path=root/'sitemap.xml'
          sm=sitemap_path.read_text(encoding='utf-8')
          sm=re.sub(r'(<loc>https://archivopopular.github.io/</loc><lastmod>)[^<]+', r'\g<1>2026-09-06', sm, count=1)
          sm=re.sub(r'(<loc>https://archivopopular.github.io/noticias.html</loc><lastmod>)[^<]+', r'\g<1>2026-09-06', sm, count=1)
          sm=re.sub(r'(<loc>https://archivopopular.github.io/buscar.html</loc><lastmod>)[^<]+', r'\g<1>2026-09-06', sm, count=1)
          entry=f'  <url><loc>{url}</loc><lastmod>2026-09-06</lastmod><changefreq>monthly</changefreq><priority>0.8</priority></url>\n'
          if url not in sm:
              pos=sm.find('<url><loc>https://archivopopular.github.io/noticias/')
              sm=sm[:pos]+entry+sm[pos:]
          sitemap_path.write_text(sm,encoding='utf-8')
          PY

      - name: Regenerar buscador
        run: node scripts/generar-buscador.mjs

      - name: Limpiar workflows temporales y publicar
        run: |
          rm -f .github/workflows/descargar-foto-fernando-pereira.yml
          rm -f .github/workflows/publicar-fernando-pereira-2026.yml
          git config user.name 'ArchivoPopular'
          git config user.email 'santiagoares3@gmail.com'
          git add -A
          git commit -m 'Publicar candidatura de Fernando Pereira a la presidencia del FA'
          git push
