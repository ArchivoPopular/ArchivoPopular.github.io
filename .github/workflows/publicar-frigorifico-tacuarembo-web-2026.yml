name: Publicar Frigorifico Tacuarembo web 2026

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publicar-frigorifico-tacuarembo-web-2026.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrar noticia
        run: python scripts/publicar-frigorifico-tacuarembo-2026.py
      - name: Regenerar buscador
        run: node scripts/generar-buscador.mjs
      - name: Publicar cambios
        run: |
          git config user.name 'Archivo Popular Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/noticias.json data/buscador.json index.html noticias.html feed.xml sitemap.xml noticias/frigorifico-tacuarembo-1300-seguro-paro-2026.html
          git commit -m 'Publicar noticia sobre 1.300 trabajadores en seguro de paro' || exit 0
          git push origin main
