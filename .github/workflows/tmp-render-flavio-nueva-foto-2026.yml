name: Render Flavio nueva foto AFP 2026

on:
  push:
    paths:
      - 'tmp-render-flavio-nueva-foto-2026.svg'
      - '.github/workflows/tmp-render-flavio-nueva-foto-2026.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas y tipografía
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-urw-base35

      - name: Descargar nueva fotografía real
        run: |
          curl -L --fail 'https://www.diariodepernambuco.com.br/_midias/jpg/2025/09/07/afp__20250907__73p44t3__v1__highres__brazilpoliticsjusticetrialsupporters-740337.jpg' -o flavio-afp.jpg

      - name: Preparar recorte proporcional
        run: |
          convert flavio-afp.jpg -auto-orient -resize '2160x1590^' -gravity center -extent 2160x1590 flavio-photo-crop.jpg

      - name: Renderizar PNG máster
        run: |
          rsvg-convert -w 2160 -h 2700 tmp-render-flavio-nueva-foto-2026.svg -o archivo-popular-flavio-dark-horse-2026-master-nueva-foto.png
          file archivo-popular-flavio-dark-horse-2026-master-nueva-foto.png

      - name: Subir PNG máster
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-flavio-dark-horse-2026-nueva-foto
          path: archivo-popular-flavio-dark-horse-2026-master-nueva-foto.png
          retention-days: 7
