name: Publicar petróleo Venezuela EE.UU. 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-petroleo-venezuela-eeuu-2026.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-urw-base35
          python -m pip install --quiet pillow
      - name: Descargar fotografía EFE
        run: |
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://i0.wp.com/efe.com/wp-content/uploads/2026/09/Venezuela-petroleo-1.webp?fit=900%2C599&ssl=1' -o /tmp/venezuela-petroleo-efe.webp
      - name: Crear placa y nota
        run: |
          echo '' | base64 -d | gzip -d > /tmp/publicar.py
          python /tmp/publicar.py
      - name: Commit
        run: |
          git config user.name 'Archivo Popular Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/news/venezuela-petroleo-henry-chirinos-efe-2026.webp assets/social/archivo-popular-eeuu-petroleo-venezuela-100-anos-2026-master.png noticias/eeuu-35-empresa-petroleo-venezuela-100-anos-2026.html data/noticias.json data/buscador.json index.html noticias.html feed.xml sitemap.xml
          git commit -m 'Publicar acuerdo petrolero EE.UU.-Venezuela' || true
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-petroleo-venezuela-master
          path: assets/social/archivo-popular-eeuu-petroleo-venezuela-100-anos-2026-master.png
