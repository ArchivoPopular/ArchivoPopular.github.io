name: Render Kast 11S 2026

on:
  push:
    paths:
      - 'tmp-render-kast-11s-2026.svg'
      - '.github/workflows/tmp-render-kast-11s-2026.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas y tipografía
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-urw-base35

      - name: Descargar fotografía real de Agencia Uno
        run: |
          curl -L --fail 'https://www.adnradio.cl/2026/09/11/kast-defiende-ausencia-de-acto-por-el-11-s-no-le-voy-a-pedir-a-nuestros-compatriotas-quedarnos-anclados-en-el-pasado/' -o source.html
          IMG=$(python3 - <<'PY'
          import re, html
          s=open('source.html',encoding='utf-8',errors='ignore').read()
          pats=[
            r'<meta[^>]+property=["\x27]og:image["\x27][^>]+content=["\x27]([^"\x27]+)',
            r'<meta[^>]+content=["\x27]([^"\x27]+)["\x27][^>]+property=["\x27]og:image["\x27]'
          ]
          for p in pats:
              m=re.search(p,s,re.I)
              if m:
                  print(html.unescape(m.group(1)))
                  break
          else:
              raise SystemExit('No se encontro og:image')
          PY
          )
          echo "$IMG"
          curl -L --fail "$IMG" -o kast-photo-original
          convert kast-photo-original -auto-orient -quality 95 kast-photo.jpg

      - name: Guardar fotografía en la web
        run: |
          mkdir -p assets/news
          cp kast-photo.jpg assets/news/kast-11s-agenciauno-2026.jpg
          git config user.name "Archivo Popular"
          git config user.email "santiagoares3@gmail.com"
          git add assets/news/kast-11s-agenciauno-2026.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Agrega foto real de Kast por el 11-S"
            git push
          fi

      - name: Preparar recorte proporcional
        run: |
          convert kast-photo.jpg -resize '2160x1590^' -gravity center -extent 2160x1590 kast-photo-crop.jpg

      - name: Renderizar PNG máster
        run: |
          rsvg-convert -w 2160 -h 2700 tmp-render-kast-11s-2026.svg -o archivo-popular-kast-11s-2026-master.png
          file archivo-popular-kast-11s-2026-master.png

      - name: Subir PNG máster
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-kast-11s-2026
          path: archivo-popular-kast-11s-2026-master.png
          retention-days: 7
