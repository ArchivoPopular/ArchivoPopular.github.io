name: Publicar Kast Milei 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-kast-milei-2026.yml'

permissions:
  contents: write
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar galería oficial ya guardada
        uses: actions/download-artifact@v4
        with:
          name: fotos-oficiales-kast-milei
          path: fotos-kast-milei
          run-id: 34154554920
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-urw-base35
          python -m pip install --quiet pillow

      - name: Ejecutar publicación
        run: python .github/scripts/publicar_kast_milei_2026.py

      - name: Commit
        run: |
          git config user.name 'ArchivoPopular'
          git config user.email 'santiagoares3@gmail.com'
          git add assets/news assets/social noticias data index.html noticias.html feed.xml sitemap.xml
          git commit -m 'Publicar reacción de Kast a declaraciones de Milei'
          git push origin main

      - uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-kast-milei-master
          path: assets/social/archivo-popular-kast-milei-zurdos-golpe-2026-master.png
