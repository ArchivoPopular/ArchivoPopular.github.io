name: Render Brasil Balotaje 2026
on:
  push:
    paths:
      - 'tmp-render-brasil-balotaje-2026.svg'
      - '.github/workflows/render-brasil-balotaje-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-urw-base35 python3-requests
      - name: Obtener foto periodística original
        run: |
          python3 - <<'PY'
          import requests,re
          from html import unescape
          sources=[
            'https://www.the-journal.com/articles/associated-press/brazil-votes-in-a-tense-lula-vs-bolsonaro-runoff-with-us-influence-over-latin-america-at-stake/',
            'https://www.durangoherald.com/articles/associated-press/brazil-votes-in-a-tense-lula-vs-bolsonaro-runoff-with-us-influence-over-latin-america-at-stake/',
            'https://apnews.com/article/a57e634f05fa4ba0b565babfca7427c7'
          ]
          img=None
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36'}
          for u in sources:
              try:
                  resp=requests.get(u,headers=headers,timeout=30); resp.raise_for_status(); h=resp.text
                  for tag in re.findall(r'<meta\\b[^>]*>',h,re.I):
                      if re.search(r'(?:property|name)=[\\"\\'](?:og:image|twitter:image)[\\"\\']',tag,re.I):
                          mm=re.search(r'content=[\\"\\']([^\\"\\']+)',tag,re.I)
                          if mm: img=unescape(mm.group(1)); break
                  if not img:
                      mm=re.search(r'https?://[^\\"\\']+imengine\\.public\\.prod[^\\"\\']+',h,re.I)
                      if mm: img=unescape(mm.group(0))
                  if img: break
              except Exception as e: print('Fuente falló:',u,str(e))
          if not img: raise SystemExit('No se pudo localizar una fotografía periodística en las fuentes AP')
          r=requests.get(img,headers=headers,timeout=30); r.raise_for_status()
          open('brasil-photo-original','wb').write(r.content)
          print('Imagen fuente:',img,'bytes:',len(r.content))
          PY
          convert brasil-photo-original -quality 92 brasil-photo.jpg
          identify brasil-photo.jpg
          cp logo.png archivo-popular-logo-master.png
      - name: Render PNG master
        run: |
          rsvg-convert -w 2160 -h 2700 tmp-render-brasil-balotaje-2026.svg -o archivo-popular-brasil-balotaje-2026-master.png
          identify archivo-popular-brasil-balotaje-2026-master.png
      - name: Integrar foto y placa en el sitio
        run: |
          mkdir -p assets/news assets/cards
          cp brasil-photo.jpg assets/news/brasil-balotaje-lula-flavio-2026.jpg
          cp archivo-popular-brasil-balotaje-2026-master.png assets/cards/archivo-popular-brasil-balotaje-2026-master.png
          git config user.name 'Archivo Popular'
          git config user.email 'santiagoares3@gmail.com'
          git add assets/news/brasil-balotaje-lula-flavio-2026.jpg assets/cards/archivo-popular-brasil-balotaje-2026-master.png
          if ! git diff --cached --quiet; then
            git commit -m 'Integra foto y master del balotaje brasileño'
            git push
          fi
      - name: Subir PNG master como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-brasil-balotaje-2026
          path: archivo-popular-brasil-balotaje-2026-master.png
          retention-days: 7
