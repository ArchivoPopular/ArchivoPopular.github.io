name: Render Abbas ONU 2026

on:
  push:
    paths:
      - 'tmp-render-abbas-onu-2026.svg'
      - '.github/workflows/tmp-render-abbas-onu-2026.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas y tipografía
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-urw-base35

      - name: Descargar fotografía real de AP
        run: |
          curl -L --fail 'https://dims.apnews.com/dims4/default/1f1f8e3/2147483647/strip/true/crop/7612x5075%2B0%2B0/resize/1600x1067%21/quality/90/?url=https%3A%2F%2Fassets.apnews.com%2Ffe%2Fe7%2F93e9d951fec597bb33aeb7f93d15%2F0b998b4698344b09968517ef10885391' -o abbas-ap.jpg

      - name: Integrar noticia y fotografía al sitio
        run: |
          mkdir -p assets/news
          cp abbas-ap.jpg assets/news/abbas-onu-ap-2026.jpg
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/noticias.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          story={
            'id':'eeuu-impide-abbas-onu-visas-palestinos-2026',
            'title':'EE.UU. vuelve a impedir que Abbas viaje a la ONU y amplía sanciones a dirigentes palestinos',
            'summary':'La administración Trump negó por segundo año consecutivo la visa a Mahmoud Abbas para asistir en persona a la Asamblea General de la ONU y extendió restricciones contra dirigentes palestinos.',
            'category':'Palestina · ONU y política exterior de EE.UU.',
            'date':'2026-09-17T13:08:00-03:00',
            'dateDisplay':'17 SEP 2026',
            'place':'Washington · Estados Unidos',
            'image':'assets/news/abbas-onu-ap-2026.jpg',
            'imageAlt':'Mahmoud Abbas durante un acto en Ramala el 9 de setiembre de 2026',
            'photoCredit':'Mahmoud Illean / AP · 9 de setiembre de 2026',
            'url':'noticias/eeuu-impide-abbas-onu-visas-palestinos-2026.html'
          }
          data=[x for x in data if x.get('id')!=story['id']]
          data.insert(0,story)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'Archivo Popular'
          git config user.email 'santiagoares3@gmail.com'
          git add assets/news/abbas-onu-ap-2026.jpg data/noticias.json
          if ! git diff --cached --quiet; then
            git commit -m 'Integra noticia sobre Abbas y la Asamblea General de la ONU'
            git push
          fi

      - name: Preparar recorte proporcional
        run: |
          convert abbas-ap.jpg -resize '2160x1590^' -gravity center -extent 2160x1590 abbas-photo-crop.jpg

      - name: Renderizar PNG máster
        run: |
          rsvg-convert -w 2160 -h 2700 tmp-render-abbas-onu-2026.svg -o archivo-popular-abbas-onu-2026-master.png
          file archivo-popular-abbas-onu-2026-master.png

      - name: Subir PNG máster
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-abbas-onu-2026
          path: archivo-popular-abbas-onu-2026-master.png
          retention-days: 7
