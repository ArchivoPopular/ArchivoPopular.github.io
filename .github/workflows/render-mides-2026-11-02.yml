name: Renderizar placa MIDES 2 noviembre 2026
on:
  push:
    paths:
      - 'assets/placas/archivo-popular-mides-100-plazas-rurales-2026-11-02-master.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar renderizador y Nimbus Sans
        run: sudo apt-get update -qq && sudo apt-get install -y -qq inkscape fonts-urw-base35
      - name: Descargar fotografía oficial y exportar sin franjas negras
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, urllib.request, subprocess, time
          p = Path('assets/placas/archivo-popular-mides-100-plazas-rurales-2026-11-02-master.svg')
          content = p.read_text(encoding='utf-8')
          url = 'https://www.gub.uy/ministerio-desarrollo-social/sites/ministerio-desarrollo-social/files/imagenes/noticias/15.jpg_0.jpeg'
          source = Path('assets/news/archivo-popular-mides-civila-colonia-2026-03-13-source.jpg')
          source.parent.mkdir(parents=True, exist_ok=True)
          if not source.exists():
              last = None
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (compatible; ArchivoPopular/1.0)'})
                      with urllib.request.urlopen(req, timeout=60) as response:
                          raw = response.read()
                      if not raw.startswith(bytes([0xff, 0xd8, 0xff])):
                          raise ValueError('La imagen descargada no es JPEG')
                      source.write_bytes(raw)
                      break
                  except Exception as e:
                      last = e
                      time.sleep(4*(attempt+1))
              if not source.exists():
                  raise RuntimeError(f'No se pudo descargar la foto oficial: {last}')
          raw = source.read_bytes()
          if url in content:
              content = content.replace(url, 'data:image/jpeg;base64,'+base64.b64encode(raw).decode('ascii'))
          logo_url = 'https://archivopopular.github.io/logo.png'
          if logo_url in content:
              logo_raw = Path('logo.png').read_bytes()
              content = content.replace(logo_url,'data:image/png;base64,'+base64.b64encode(logo_raw).decode('ascii'))
          if 'width="2160" height="1590" preserveAspectRatio="xMidYMid slice"' not in content:
              raise ValueError('La foto no cubre los 1590 px hasta la franja roja')
          if 'FOTO: MINISTERIO DE DESARROLLO SOCIAL' not in content:
              raise ValueError('Crédito incorrecto')
          p.write_text(content, encoding='utf-8')
          png = p.with_suffix('.png')
          subprocess.run(['inkscape',str(p),'--export-filename='+str(png),'--export-width=2160','--export-height=2700'],check=True)
          import struct
          pngraw = png.read_bytes()
          assert pngraw[:8] == b'\\x89PNG\\r\\n\\x1a\\n'
          assert struct.unpack('>II', pngraw[16:24]) == (2160,2700)
          print(f'Placa exportada: {png} ({png.stat().st_size} bytes), foto original: {source.stat().st_size} bytes')
          PY
      - name: Guardar SVG autocontenido, fotografía original y PNG máster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/placas/archivo-popular-mides-100-plazas-rurales-2026-11-02-master.svg assets/placas/archivo-popular-mides-100-plazas-rurales-2026-11-02-master.png assets/news/archivo-popular-mides-civila-colonia-2026-03-13-source.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Publicar placa MIDES en PNG y SVG con foto documental"
            git pull --rebase origin main
            git push origin main
          fi
