name: Render PISA con plantilla oficial

on:
  push:
    paths:
      - 'tmp-render-pisa-correct.svg'
      - '.github/workflows/tmp-render-pisa-correct.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas y tipografía
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-urw-base35

      - name: Descargar fotografía original
        run: |
          curl -L --fail 'https://imagenes.montevideo.com.uy/imgnoticias/202609/_W933_80/970436.jpg' -o pisa-photo.jpg

      - name: Preparar recorte proporcional
        run: |
          convert pisa-photo.jpg -resize '2160x1590^' -gravity center -extent 2160x1590 pisa-photo-crop.jpg

      - name: Renderizar PNG máster
        run: |
          rsvg-convert -w 2160 -h 2700 tmp-render-pisa-correct.svg -o archivo-popular-pisa-2025-uruguay-2026-master-correcto.png
          file archivo-popular-pisa-2025-uruguay-2026-master-correcto.png

      - name: Subir PNG máster
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-pisa-2025-plantilla-oficial
          path: archivo-popular-pisa-2025-uruguay-2026-master-correcto.png
          retention-days: 7
