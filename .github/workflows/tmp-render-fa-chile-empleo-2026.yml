name: Render Frente Amplio Chile empleo 2026

on:
  push:
    paths:
      - 'tmp-render-fa-chile-empleo-2026.svg'
      - '.github/workflows/tmp-render-fa-chile-empleo-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-urw-base35
      - name: Descargar fotografia periodistica real
        run: |
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://media.biobiochile.cl/wp-content/uploads/2026/09/yeomans.png' -o yeomans-source.png
          identify yeomans-source.png
          convert yeomans-source.png -resize '2160x1590>' -background '#000000' -gravity center -extent 2160x1590 yeomans-photo-frame.png
          cp logo.png archivo-popular-logo-master.png
      - name: Guardar fotografia original en el sitio
        run: |
          mkdir -p assets/news
          cp yeomans-source.png assets/news/yeomans-agenda-empleo-agencia-uno-2026.png
          git config user.name 'Archivo Popular'
          git config user.email 'santiagoares3@gmail.com'
          git add assets/news/yeomans-agenda-empleo-agencia-uno-2026.png
          if ! git diff --cached --quiet; then
            git commit -m 'Integra foto de Gael Yeomans de Agencia UNO'
            git pull --rebase --autostash origin main
            git push
          fi
      - name: Renderizar PNG master
        run: |
          rsvg-convert -w 2160 -h 2700 tmp-render-fa-chile-empleo-2026.svg -o archivo-popular-fa-chile-empleo-kast-2026-master.png
          identify archivo-popular-fa-chile-empleo-kast-2026-master.png
      - name: Subir PNG master
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-fa-chile-empleo-kast-2026
          path: archivo-popular-fa-chile-empleo-kast-2026-master.png
          retention-days: 7
