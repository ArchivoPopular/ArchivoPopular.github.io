name: Render Rendicion Senado FA 2026

on:
  push:
    paths:
      - 'tmp-render-rendicion-senado-fa-2026.svg'
      - '.github/workflows/tmp-render-rendicion-senado-fa-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-urw-base35
      - name: Descargar fotografía oficial publicada por Carolina Cosse
        run: |
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://imagenes.montevideo.com.uy/imgnoticias/202509/_W933_80/930468.jpg' -o rendicion-photo.jpg
          identify rendicion-photo.jpg
          cp logo.png archivo-popular-logo-master.png
      - name: Renderizar PNG master
        run: |
          rsvg-convert -w 2160 -h 2700 tmp-render-rendicion-senado-fa-2026.svg -o archivo-popular-rendicion-senado-fa-2026-master.png
          identify archivo-popular-rendicion-senado-fa-2026-master.png
      - name: Integrar foto, placa e índice al sitio
        run: |
          mkdir -p assets/news assets/cards
          cp rendicion-photo.jpg assets/news/rendicion-cuentas-senado-cosse-2026.jpg
          cp archivo-popular-rendicion-senado-fa-2026-master.png assets/cards/archivo-popular-rendicion-senado-fa-2026-master.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/noticias.json')
          data=json.loads(p.read_text())
          story={
            'id':'rendicion-cuentas-senado-sancion-definitiva-fa-2026',
            'title':'El Senado dio sanción definitiva a la Rendición con los votos del Frente Amplio',
            'summary':'La Cámara alta aprobó la Rendición de Cuentas sin modificaciones. La aprobación general fue con los votos del Frente Amplio y el texto quedó listo para ser promulgado por el Poder Ejecutivo.',
            'category':'Política nacional · Rendición de Cuentas',
            'date':'2026-09-23T18:13:00-03:00',
            'dateDisplay':'23 SEP 2026',
            'place':'Palacio Legislativo · Montevideo',
            'image':'assets/news/rendicion-cuentas-senado-cosse-2026.jpg',
            'imageAlt':'Sesión de la Cámara de Senadores durante el tratamiento de la Rendición de Cuentas',
            'photoCredit':'Cuenta oficial de Carolina Cosse en X · publicada por Montevideo Portal',
            'url':'noticias/rendicion-cuentas-senado-sancion-definitiva-fa-2026.html'
          }
          data=[story]+[x for x in data if x.get('id')!=story['id']]
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          s=Path('sitemap.xml')
          txt=s.read_text()
          url='https://archivopopular.github.io/noticias/rendicion-cuentas-senado-sancion-definitiva-fa-2026.html'
          if url not in txt:
              txt=txt.replace('</urlset>',f'  <url><loc>{url}</loc><lastmod>2026-09-23</lastmod></url>\n</urlset>')
              s.write_text(txt)
          PY
          git config user.name 'Archivo Popular'
          git config user.email 'santiagoares3@gmail.com'
          git add assets/news/rendicion-cuentas-senado-cosse-2026.jpg assets/cards/archivo-popular-rendicion-senado-fa-2026-master.png data/noticias.json sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Integra Rendición de Cuentas y placa master'
            git pull --rebase --autostash origin main
            git push
          fi
      - name: Subir PNG master
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-rendicion-senado-fa-2026
          path: archivo-popular-rendicion-senado-fa-2026-master.png
          retention-days: 7
