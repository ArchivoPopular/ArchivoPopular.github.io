name: Render Lula encuesta Brasil 2026

on:
  push:
    paths:
      - 'tmp-render-lula-encuesta-2026.svg'
      - '.github/workflows/tmp-render-lula-encuesta-2026.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas y tipografía
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-urw-base35

      - name: Descargar fotografía real de EFE
        run: |
          curl -L --fail 'https://i0.wp.com/efe.com/wp-content/uploads/2026/09/lula-2.webp?fit=900%2C599&ssl=1' -o lula-efe.webp
          convert lula-efe.webp -auto-orient -quality 96 lula-efe.jpg

      - name: Guardar fotografía en la web
        run: |
          mkdir -p assets/news
          cp lula-efe.jpg assets/news/lula-datafolha-efe-2026.jpg
          git config user.name "Archivo Popular"
          git config user.email "santiagoares3@gmail.com"
          git add assets/news/lula-datafolha-efe-2026.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Agrega foto real de Lula para encuesta Datafolha"
            git push
          fi

      - name: Preparar recorte proporcional
        run: |
          convert lula-efe.jpg -resize '2160x1590^' -gravity center -extent 2160x1590 lula-photo-crop.jpg

      - name: Renderizar PNG máster
        run: |
          rsvg-convert -w 2160 -h 2700 tmp-render-lula-encuesta-2026.svg -o archivo-popular-lula-datafolha-2026-master.png
          file archivo-popular-lula-datafolha-2026-master.png

      - name: Subir PNG máster
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-lula-datafolha-2026
          path: archivo-popular-lula-datafolha-2026-master.png
          retention-days: 7
