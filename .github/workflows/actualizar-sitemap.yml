name: Actualizar sitemap

on:
  push:
    branches:
      - main
    paths:
      - "noticias/**/*.html"
      - "index.html"
      - "noticias.html"
      - "historia.html"
      - "personajes.html"
      - "fotografos.html"
      - "bio_santiagoares.html"
      - "scripts/generar-sitemap.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-main
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar sitemap
        run: node scripts/generar-sitemap.mjs

      - name: Guardar cambios si los hay
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "El sitemap ya está actualizado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Actualiza sitemap automáticamente"
          git push
