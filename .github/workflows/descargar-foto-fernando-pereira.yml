name: Descargar foto Fernando Pereira

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/descargar-foto-fernando-pereira.yml'

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar fotografía CC BY-SA 4.0
        run: |
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Fernando_Pereira_Kosec.jpg' -o fernando-pereira.jpg
          file fernando-pereira.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: fernando-pereira-foto-cc
          path: fernando-pereira.jpg
