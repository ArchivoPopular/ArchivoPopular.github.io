name: Inspeccionar foto Kast Milei
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspeccionar-foto-kast-milei.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspeccionar galería oficial
        run: |
          python - <<'PY'
          import requests,re
          from urllib.parse import urljoin
          u='https://prensa.presidencia.cl/fotografia.aspx?id=339732'
          t=requests.get(u,timeout=30).text
          print('status',len(t))
          for m in re.findall(r'(?:href|src)=[\"\']([^\"\']+)',t,re.I):
              if any(x in m.lower() for x in ['jpg','jpeg','png','foto','download','galeria']):
                  print(urljoin(u,m))
          PY
