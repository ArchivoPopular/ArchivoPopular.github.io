name: Render Trump Shield Americas ONU 2026

on:
  push:
    paths:
      - 'tmp-render-trump-shield-americas-onu-2026.svg'
      - '.github/workflows/tmp-render-trump-shield-americas-onu-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-urw-base35
      - name: Descargar fotografía periodística real
        run: |
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://www.aljazeera.com/wp-content/uploads/2026/09/reuters_6ab33814-1790130196.jpg?quality=80&resize=770%2C513' -o trump-shield-photo.jpg
          identify trump-shield-photo.jpg
          cp logo.png archivo-popular-logo-master.png
      - name: Renderizar PNG master
        run: |
          rsvg-convert -w 2160 -h 2700 tmp-render-trump-shield-americas-onu-2026.svg -o archivo-popular-trump-shield-americas-onu-2026-master.png
          identify archivo-popular-trump-shield-americas-onu-2026-master.png
      - name: Integrar foto, placa e índice al sitio
        run: |
          mkdir -p assets/news assets/cards
          cp trump-shield-photo.jpg assets/news/trump-shield-americas-kylie-cooper-reuters-2026.jpg
          cp archivo-popular-trump-shield-americas-onu-2026-master.png assets/cards/archivo-popular-trump-shield-americas-onu-2026-master.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/noticias.json')
          data=json.loads(p.read_text())
          story={
            'id':'trump-fuerza-militar-america-latina-shield-onu-2026',
            'title':'Trump promete “fuerza militar sin igual” en América Latina y reúne a 15 gobiernos contra los carteles',
            'summary':'Trump encabezó en Nueva York una reunión de Shield of the Americas y pidió sanciones coordinadas contra 24 organizaciones criminales. Brasil y México no forman parte de la coalición.',
            'category':'Estados Unidos · América Latina · ONU',
            'date':'2026-09-23T18:45:00-03:00',
            'dateDisplay':'23 SEP 2026',
            'place':'Nueva York · Estados Unidos',
            'image':'assets/news/trump-shield-americas-kylie-cooper-reuters-2026.jpg',
            'imageAlt':'Donald Trump participa de una reunión de Shield of the Americas durante la Asamblea General de la ONU',
            'photoCredit':'Kylie Cooper / Reuters',
            'url':'noticias/trump-fuerza-militar-america-latina-shield-onu-2026.html'
          }
          data=[story]+[x for x in data if x.get('id')!=story['id']]
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          s=Path('sitemap.xml')
          txt=s.read_text()
          url='https://archivopopular.github.io/noticias/trump-fuerza-militar-america-latina-shield-onu-2026.html'
          if url not in txt:
              txt=txt.replace('</urlset>',f'  <url><loc>{url}</loc><lastmod>2026-09-23</lastmod></url>\n</urlset>')
              s.write_text(txt)
          PY
          git config user.name 'Archivo Popular'
          git config user.email 'santiagoares3@gmail.com'
          git add assets/news/trump-shield-americas-kylie-cooper-reuters-2026.jpg assets/cards/archivo-popular-trump-shield-americas-onu-2026-master.png data/noticias.json sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Integra noticia de Shield of the Americas y placa master'
            git pull --rebase --autostash origin main
            git push
          fi
      - name: Subir PNG master
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-trump-shield-americas-onu-2026
          path: archivo-popular-trump-shield-americas-onu-2026-master.png
          retention-days: 7
