name: Render Operacion Trazador Gandini 2026

on:
  push:
    paths:
      - 'tmp-render-gandini-trazador-2026.svg'
      - '.github/workflows/tmp-render-gandini-trazador-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-urw-base35
      - name: Descargar fotografía periodística real
        run: |
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://imagenes.montevideo.com.uy/imgnoticias/202508/_W933_80/928425.jpg' -o gandini-photo.jpg
          identify gandini-photo.jpg
          cp logo.png archivo-popular-logo-master.png
      - name: Guardar fotografía en el sitio
        run: |
          mkdir -p assets/news
          cp gandini-photo.jpg assets/news/gandini-operacion-trazador-focouy-2026.jpg
          git config user.name 'Archivo Popular'
          git config user.email 'santiagoares3@gmail.com'
          git add assets/news/gandini-operacion-trazador-focouy-2026.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Integra foto de Gandini para Operación Trazador'
            git pull --rebase --autostash origin main
            git push
          fi
      - name: Renderizar PNG master
        run: |
          rsvg-convert -w 2160 -h 2700 tmp-render-gandini-trazador-2026.svg -o archivo-popular-gandini-trazador-2026-master.png
          identify archivo-popular-gandini-trazador-2026-master.png
      - name: Subir PNG master
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-gandini-trazador-2026
          path: archivo-popular-gandini-trazador-2026-master.png
          retention-days: 7
