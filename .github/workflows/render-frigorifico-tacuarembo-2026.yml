name: Render Frigorifico Tacuarembo 2026

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/render-frigorifico-tacuarembo-2026.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Download documentary photo
        run: curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://media.subrayado.com.uy/p/1c7d150f66cceeee584bb4bc340ceed9/adjuntos/230/imagenes/004/085/0004085991/658x425/smart/carnes-frigorifico-tacuarembo-conflicto.jpg' -o /tmp/frigorifico-tacuarembo-subrayado.jpg
      - name: Render master PNG
        run: python scripts/render-frigorifico-tacuarembo-2026.py
      - name: Commit generated assets
        run: |
          git config user.name 'Archivo Popular Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/news/frigorifico-tacuarembo-conflicto-subrayado-2026.jpg assets/social/archivo-popular-frigorifico-tacuarembo-1300-seguro-paro-2026-master.png archivo-popular-frigorifico-tacuarembo-1300-seguro-paro-2026-master.png
          git commit -m 'Agregar placa y foto de Frigorifico Tacuarembo' || exit 0
          git push origin main
      - name: Upload master PNG
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-frigorifico-tacuarembo-master
          path: archivo-popular-frigorifico-tacuarembo-1300-seguro-paro-2026-master.png

