name: Render PISA 2025 master

on:
  push:
    paths:
      - 'render-pisa-2025-uruguay.svg'
      - '.github/workflows/render-pisa-2025.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-urw-base35
      - name: Download authentic ANEP photo
        run: |
          curl -L --fail --retry 3 'https://imagenes.montevideo.com.uy/imgnoticias/202609/_W933_80/970436.jpg' -o photo-pisa-2025.jpg
          file photo-pisa-2025.jpg
      - name: Render PNG master
        run: |
          rsvg-convert -w 2160 -h 2700 render-pisa-2025-uruguay.svg -o archivo-popular-pisa-2025-uruguay-2026-master.png
          file archivo-popular-pisa-2025-uruguay-2026-master.png
      - name: Upload PNG master
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-pisa-2025-uruguay-2026-master
          path: archivo-popular-pisa-2025-uruguay-2026-master.png
          if-no-files-found: error
          retention-days: 7
