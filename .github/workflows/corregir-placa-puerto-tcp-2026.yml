name: Corregir placa puerto TCP 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corregir-placa-puerto-tcp-2026.yml'

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-urw-base35
          python -m pip install --quiet pillow
      - name: Corregir placa
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          p=Path('assets/social/archivo-popular-paro-puerto-tcp-2026-master.png')
          im=Image.open(p).convert('RGB')
          d=ImageDraw.Draw(im)
          font_path='/usr/share/fonts/opentype/urw-base35/NimbusSans-Bold.otf'
          head=ImageFont.truetype(font_path,150)
          info=ImageFont.truetype(font_path,48)
          
          def spaced(text,x,y,font,fill,spacing,anchor='ls'):
              cur=float(x)
              for ch in text:
                  d.text((cur,y),ch,font=font,fill=fill,anchor=anchor)
                  adv=d.textlength(ch,font=font)
                  cur += adv + spacing
          
          d.rectangle((0,1590,2160,2576),fill='#090909')
          d.rectangle((0,1590,2160,1602),fill='#E30613')
          lines=['PARO EN EL PUERTO','SINDICATO RECLAMA','GARANTÍAS LABORALES','PN PIDE ESENCIALIDAD']
          ys=[1782,1954,2126,2298]
          for line,y in zip(lines,ys):
              spaced(line,120,y,head,'#FFFFFF',-2)
          spaced('7 DE SETIEMBRE DE 2026',120,2510,info,'#E30613',2.5)
          # ubicación alineada a la derecha, calculando el ancho con espaciado
          loc='PUERTO DE MONTEVIDEO · URUGUAY'
          widths=sum(d.textlength(ch,font=info)+2 for ch in loc)-2
          spaced(loc,2040-widths,2510,info,'#BEBAB2',2)
          im.save(p,quality=96)
          PY
      - name: Commit
        run: |
          git config user.name 'ArchivoPopular'
          git config user.email 'santiagoares3@gmail.com'
          git add assets/social/archivo-popular-paro-puerto-tcp-2026-master.png
          git commit -m 'Corregir ajuste del titular en placa del puerto'
          git push origin main
      - uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-paro-puerto-tcp-master-corregida
          path: assets/social/archivo-popular-paro-puerto-tcp-2026-master.png
