name: Render Trump 5000 2026

on:
  push:
    paths:
      - 'tmp-render-trump-5000-2026.svg'
      - '.github/workflows/tmp-render-trump-5000-2026.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas y tipografía
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-urw-base35

      - name: Descargar fotografía real de AP
        run: |
          curl -L --fail 'https://dims.apnews.com/dims4/default/a4297b3/2147483647/strip/true/crop/6000x4000%2B0%2B0/resize/1600x1067%21/quality/90/?url=https%3A%2F%2Fassets.apnews.com%2F0f%2Ff0%2F487e607cb83ece6383f1b2db910f%2F455d4638c7514fbcb813741b672e2ac2' -o trump-ap.jpg

      - name: Guardar fotografía en la web
        run: |
          mkdir -p assets/news
          cp trump-ap.jpg assets/news/trump-dividend-ap-2026.jpg
          git config user.name "Archivo Popular"
          git config user.email "santiagoares3@gmail.com"
          git add assets/news/trump-dividend-ap-2026.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Agrega foto real de Trump para nota del dividendo"
            git push
          fi

      - name: Preparar recorte proporcional
        run: |
          convert trump-ap.jpg -resize '2160x1590^' -gravity center -extent 2160x1590 trump-photo-crop.jpg

      - name: Renderizar PNG máster
        run: |
          rsvg-convert -w 2160 -h 2700 tmp-render-trump-5000-2026.svg -o archivo-popular-trump-5000-2026-master.png
          file archivo-popular-trump-5000-2026-master.png

      - name: Subir PNG máster
        uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-trump-5000-2026
          path: archivo-popular-trump-5000-2026-master.png
          retention-days: 7
