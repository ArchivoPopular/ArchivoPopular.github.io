name: Limpiar duplicado Kast Milei

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/limpiar-duplicado-kast-milei.yml'

permissions:
  contents: write

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Limpiar duplicado
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          oldid='kast-milei-zurdos-mugrosos-golpe-chile-2026'
          oldrel='noticias/kast-milei-zurdos-mugrosos-golpe-chile-2026.html'
          oldurl='https://archivopopular.github.io/'+oldrel
          p=Path('data/noticias.json')
          news=json.loads(p.read_text(encoding='utf-8'))
          news=[n for n in news if n.get('id')!=oldid]
          p.write_text(json.dumps(news,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          q=Path(oldrel)
          if q.exists(): q.unlink()
          n=Path('noticias.html')
          if n.exists():
              s=n.read_text(encoding='utf-8')
              s=re.sub(r'\s*<a class="news-card" href="'+re.escape(oldrel)+r'">.*?</a>','',s,flags=re.S)
              n.write_text(s,encoding='utf-8')
          f=Path('feed.xml')
          if f.exists():
              s=f.read_text(encoding='utf-8')
              s=re.sub(r'\s*<item>.*?'+re.escape(oldurl)+r'.*?</item>','',s,flags=re.S)
              f.write_text(s,encoding='utf-8')
          sm=Path('sitemap.xml')
          if sm.exists():
              s=sm.read_text(encoding='utf-8')
              s=re.sub(r'\s*<url>.*?'+re.escape(oldurl)+r'.*?</url>','',s,flags=re.S)
              sm.write_text(s,encoding='utf-8')
          PY
          node scripts/generar-buscador.mjs
      - name: Commit
        run: |
          git config user.name 'ArchivoPopular'
          git config user.email 'santiagoares3@gmail.com'
          git add data/noticias.json data/buscador.json noticias.html feed.xml sitemap.xml
          git add -u noticias
          git commit -m 'Eliminar publicación duplicada sobre Kast y Milei'
          git push origin main
