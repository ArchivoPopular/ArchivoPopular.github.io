name: Publicar uruguayos EEUU decreto Lacalle 2026 v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-uruguayos-eeuu-decreto-lacalle-2026-v2.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-urw-base35
          python -m pip install --quiet pillow
      - name: Ejecutar publicación
        run: python .github/scripts/publicar_uruguayos_eeuu_2026.py
      - name: Commit
        run: |
          git config user.name 'ArchivoPopular'
          git config user.email 'santiagoares3@gmail.com'
          git add data/noticias.json data/buscador.json index.html noticias.html feed.xml sitemap.xml noticias/uruguayos-eeuu-decreto-lacalle-deportaciones-2026.html assets/news/orsi-torre-ejecutiva-ignacio-turell-2026-09-04.jpg assets/social/archivo-popular-uruguayos-eeuu-decreto-lacalle-2026-master.png
          git commit -m 'Publicar reclamo de uruguayos en EEUU por decreto 281/022'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-uruguayos-eeuu-decreto-lacalle-master
          path: assets/social/archivo-popular-uruguayos-eeuu-decreto-lacalle-2026-master.png
