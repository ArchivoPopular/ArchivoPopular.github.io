name: Publicar paro universitario Argentina 2026
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-paro-universitario-argentina-2026.yml'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-urw-base35
          python -m pip install --quiet pillow requests
      - name: Generar nota y placa
        run: python .github/scripts/publicar_paro_universitario_argentina_2026.py
      - name: Commit
        run: |
          git config user.name 'ArchivoPopular'
          git config user.email 'santiagoares3@gmail.com'
          git add assets/news assets/social noticias data index.html noticias.html feed.xml sitemap.xml
          git commit -m 'Publicar paro universitario nacional en Argentina'
          git push origin main
      - uses: actions/upload-artifact@v4
        with:
          name: archivo-popular-paro-universitario-argentina-2026
          path: assets/social/archivo-popular-paro-universitario-argentina-2026-master.png
